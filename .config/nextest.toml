[test-groups]
run-in-isolation = { max-threads = 32 }
# these are tests that must not run with other tests concurrently. All tests in
# this group can take up at most 32 threads among them, but each one requiring
# 16 threads also. The effect should be that tests run isolated.

[[profile.ci.overrides]]
filter = 'test(::run_in_isolation::)'
test-group = 'run-in-isolation'
threads-required = 32

# The imported protocol packages (krikos-blobs, krikos-docs) are
# filesystem-, replica- and endpoint-heavy and repeatedly exceed the generic
# 30-second bound on hosted runners. Observed across ubuntu, macOS and Windows,
# so this is not one platform's quirk.
#
# Naming individual tests proved to be whack-a-mole: an earlier filter listed
# test_counters_manager_proptest_fs and test_sync_many_authors_fs, and then
# test_sync_many_authors_memory, test_download_policies, connection_pool_idle
# and connection_pool_smoke each timed out in turn. Scope by package instead.
#
# Ordering matters and is load-bearing: nextest resolves each setting from the
# FIRST override (top to bottom) whose filter matches. A narrower test-name
# override placed above one of these would silently shadow it — that bug
# already shipped once, giving one krikos-docs test a 120s ceiling instead of
# 180s on CI only. Do not add a test-name override above these blocks.
#
# connection_pool_idle/connection_pool_smoke (krikos-blobs) and
# test_download_policies (krikos-docs) were the endpoint-heavy tests actually
# driving these ceilings up to 180s: they built endpoints against real n0
# relay infrastructure (presets::N0 / the default RelayMode, which resolves to
# n0's production or staging deployment) instead of a relay spawned in-process,
# making them latency-bound on WAN conditions. They're now converted to use
# krikos::test_utils::run_relay_server() and complete in low single-digit
# seconds locally (see git history for before/after numbers), so the 180s
# ceiling they used to need is gone.
#
# What's left in each package is genuinely filesystem/CPU heavy, not
# network-bound, and keeps its slack:
# - krikos-blobs: test_counters_manager_proptest_fs (proptest over a real fs
#   store; ~3.7s locally, uncontended).
# - krikos-docs: test_sync_many_authors_memory/_fs (nested author/message
#   fanout over many sync rounds, no network at all — pure in-memory
#   tokio::io::duplex; ~15-16s locally, uncontended) plus whatever headroom
#   the 120s internal TIMEOUT in tests/sync.rs needs (see below).
#
# Ceilings below are lowered but kept well above local worst-case times to
# leave room for slower/contended CI hardware; they were not tuned against
# real hosted-runner timings, so if either package starts timing out again on
# CI, widen the affected package's ceiling rather than reintroducing
# individual test-name overrides.
[[profile.ci.overrides]]
filter = 'package(krikos-blobs)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'package(krikos-blobs)'
slow-timeout = { period = "30s", terminate-after = 3 }

# krikos-docs' sync and download tests are filesystem- and replica-heavy and
# repeatedly exceed the generic 30-second bound on hosted runners — observed on
# ubuntu and macOS, not only Windows. Naming individual tests proved to be
# whack-a-mole: test_sync_many_authors_memory and test_download_policies also
# timed out. Scope the exception to the package instead, keeping a finite
# ceiling so a genuine hang still fails.
[[profile.ci.overrides]]
filter = 'package(krikos-docs)'
# 150s ceiling (down from 180s now that test_download_policies no longer
# dials a real relay) — must stay ABOVE the 120s TIMEOUT in tests/sync.rs so
# that exceeding the test's own deadline reports its diagnostic rather than
# being killed by the harness first. That 120s deadline guards genuine sync
# convergence speed on slow CI hardware (raised from 60s after a 62.1s
# convergence on a hosted Windows runner) and is unrelated to relay dialing,
# so it was not changed by the hermetic-test conversion.
slow-timeout = { period = "30s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'package(krikos-docs)'
# 150s ceiling — see the profile.ci.overrides entry above for the same filter.
slow-timeout = { period = "30s", terminate-after = 5 }

# This conformance test must cross the exact 256-entry lineage-retention boundary
# before proving that a late branch is authenticated from durable events. Batching
# removes repeated store-clone overhead, but the remaining signature verification
# and durable lineage reconstruction still take roughly 15-20s in isolation and
# exceeded the generic 30s ceiling twice on a contended macOS runner. Keep the
# exception exact and finite so a genuine hang still fails.
[[profile.ci.overrides]]
filter = 'package(krikos-identity) & binary(store_conformance) & test(=evicted_lineage_conflict_is_authenticated_from_durable_sources)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'package(krikos-identity) & binary(store_conformance) & test(=evicted_lineage_conflict_is_authenticated_from_durable_sources)'
slow-timeout = { period = "30s", terminate-after = 3 }

# This interchange conformance test intentionally builds 257 fully authenticated
# provider and audit records to cross the 256-item chunk boundary, then repeats
# assembly over reordered and tampered variants. It takes roughly 55s in isolation
# and exceeded the generic ceiling on a contended Ubuntu runner. Retain a finite
# 150s ceiling for this exact boundary test.
[[profile.ci.overrides]]
filter = 'package(krikos-identity) & binary(provider_wire_formats) & test(=provider_interchange_assembles_out_of_order_and_rejects_tampering)'
slow-timeout = { period = "30s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'package(krikos-identity) & binary(provider_wire_formats) & test(=provider_interchange_assembles_out_of_order_and_rejects_tampering)'
slow-timeout = { period = "30s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(::run_in_isolation::)'
test-group = 'run-in-isolation'
threads-required = 32

[profile.default]
default-filter = 'not binary(patchbay)'
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.patchbay]
fail-fast = false
test-threads = 1
default-filter = 'binary(patchbay)'
slow-timeout = { period = "30s", terminate-after = 4 }

# Wine tests run under Wine emulation which is significantly slower than native.
# Give tests more time to complete.
[profile.wine]
slow-timeout = { period = "60s", terminate-after = 5 }
# Run all tests even if some fail, so we get full visibility.
fail-fast = false
# Run tests sequentially - Wine networking can be flaky with concurrent tests.
test-threads = 1
# Network change tests are too flaky under Wine emulation due to slow/unreliable
# socket rebinding. Skip them until Wine compatibility improves.
default-filter = 'not test(network_change)'

[[profile.wine.overrides]]
filter = 'test(::run_in_isolation::)'
test-group = 'run-in-isolation'
threads-required = 32
