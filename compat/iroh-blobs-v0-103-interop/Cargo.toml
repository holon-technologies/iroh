[package]
name = "iroh-blobs-v0-103-interop"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[patch.crates-io]
krikos-noq = { path = "../../vendor/noq-1.1.0" }

[dependencies]
anyhow = "1"
iroh-v1 = { package = "iroh", version = "=1.0.3", features = ["tls-ring"] }
iroh-v2 = { package = "iroh", path = "../../iroh", features = ["tls-ring"] }
iroh-blobs-v1 = { package = "iroh-blobs", version = "=0.103.0" }
iroh-blobs-v2 = { package = "iroh-blobs", path = "../../protocols/iroh-blobs" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
