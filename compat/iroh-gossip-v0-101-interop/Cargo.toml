[package]
name = "iroh-gossip-v0-101-interop"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[patch.crates-io]
krikos-noq = { path = "../../vendor/noq-1.1.0" }

[dependencies]
anyhow = "1"
iroh-v1 = { package = "iroh", version = "=1.0.3", features = ["tls-ring"] }
iroh-v2 = { package = "krikos", path = "../../krikos", features = ["tls-ring"] }
iroh-gossip-v1 = { package = "iroh-gossip", version = "=0.101.0" }
iroh-gossip-v2 = { package = "krikos-gossip", path = "../../protocols/krikos-gossip" }
n0-future = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
