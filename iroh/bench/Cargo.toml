[package]
name = "iroh-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.11"
hdrhistogram = { version = "7.2", default-features = false }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
iroh = { workspace = true, default-features = false }
iroh-dns = { workspace = true, optional = true }
iroh-dns-server = { workspace = true, features = [
    "test-utils",
], optional = true }
iroh-metrics = { version = "1.0.1", optional = true }
iroh-relay = { workspace = true, features = [
    "server",
    "test-utils",
], optional = true }
n0-future = "0.3"
n0-error = "1.0.0"
noq = { package = "iroh-noq", version = "=1.1.0-holon.1" }
rcgen = "0.14"
rustls = { version = "0.23.33", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10.8", optional = true }
tempfile = { version = "3.23.0", optional = true }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.0", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
] }

[features]
default = ["metrics", "fast-apple-datapath", "tls-ring"]
metrics = ["iroh/metrics", "iroh-metrics"]
local-relay = ["iroh/test-utils"]
resource-canary = [
    "dep:iroh-dns",
    "dep:iroh-dns-server",
    "dep:iroh-relay",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "iroh/test-utils",
    "tokio/full",
]
# Use private Apple APIs to send multiple packets in a single syscall.
fast-apple-datapath = ["iroh/fast-apple-datapath", "noq/fast-apple-datapath"]
qlog = ["iroh/qlog", "noq/qlog"]
tls-ring = ["rustls/ring", "iroh/tls-ring"]
tls-aws-lc-rs = ["rustls/aws-lc-rs", "iroh/tls-aws-lc-rs"]

[[bin]]
name = "resource-canary"
path = "src/bin/resource_canary.rs"
required-features = ["resource-canary"]
