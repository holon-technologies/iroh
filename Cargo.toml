[workspace]
members = [
  "krikos-base",
  "krikos-resolver",
  "krikos-dns",
  "krikos-dns-server",
  "krikos",
  "krikos/bench",
  "krikos-relay",
  "krikos-runtime",
  "framework/app",
  "examples/local-first-notes",
  "integration-tests/local-first-app",
  "protocols/krikos-blobs",
  "protocols/krikos-docs",
  "protocols/krikos-gossip",
  "tools/determinism-checker",
]
exclude = [
  "compat/iroh-blobs-v0-103-interop",
  "compat/iroh-gossip-v0-101-interop",
  "compat/relay-v1-interop",
  "fuzz",
  "krikos-sim",
  "vendor/hickory-server-0.26.1",
  "vendor/noq-1.1.0",
  "vendor/rustls-0.23.41",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/holon-technologies/iroh"

[workspace.dependencies]
krikos = { version = "2.0.0", path = "krikos", default-features = false }
krikos-base = { version = "2.0.0", path = "krikos-base", default-features = false }
krikos-resolver = { version = "2.0.0", path = "krikos-resolver", default-features = false }
krikos-dns = { version = "2.0.0", path = "krikos-dns" }
krikos-dns-server = { version = "2.0.0", path = "krikos-dns-server" }
krikos-relay = { version = "2.0.0", path = "krikos-relay", default-features = false }
krikos-runtime = { version = "2.0.0", path = "krikos-runtime" }
krikos-app = { version = "2.0.0", path = "framework/app" }
krikos-blobs = { version = "2.0.0", path = "protocols/krikos-blobs", default-features = false }
krikos-docs = { version = "2.0.0", path = "protocols/krikos-docs" }
krikos-gossip = { version = "2.0.0", path = "protocols/krikos-gossip", default-features = false }

[profile.release]
debug = true

[profile.dev-ci]
inherits = 'dev'
opt-level = 1

[profile.optimized-release]
inherits = 'release'
debug = false
lto = true
debug-assertions = false
opt-level = 3
panic = 'abort'
incremental = false

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

# We use this --cfg for documenting the cargo features on which an API
# is available.  To preview this locally use: RUSTDOCFLAGS="--cfg
# krikos_docsrs" cargo +nightly doc --all-features.  We use our own
# krikos_docsrs instead of the common docsrs to avoid also enabling this
# feature in any dependencies, because some indirect dependencies
# require a feature enabled when using `--cfg docsrs` which we can not
# do.  To enable for a crate set `#![cfg_attr(krikos_docsrs,
# feature(doc_cfg))]` in the crate.
# We also have our own `krikos_loom` cfg to enable tokio-rs/loom testing.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(krikos_blobs_docsrs)", "cfg(krikos_docsrs)", "cfg(krikos_loom)", "cfg(skip_patchbay)"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
unused-async = "warn"

[workspace.metadata.cargo-semver-checks.lints]
enum_struct_variant_field_marked_deprecated = { required-update = "minor" }
enum_tuple_variant_field_marked_deprecated = { required-update = "minor" }
enum_variant_marked_deprecated = { required-update = "minor" }
function_marked_deprecated = { required-update = "minor" }
global_value_marked_deprecated = { required-update = "minor" }
macro_marked_deprecated = { required-update = "minor" }
proc_macro_marked_deprecated = { required-update = "minor" }
struct_field_marked_deprecated = { required-update = "minor" }
trait_associated_const_marked_deprecated = { required-update = "minor" }
trait_associated_type_marked_deprecated = { required-update = "minor" }
trait_marked_deprecated = { required-update = "minor" }
trait_method_marked_deprecated = { required-update = "minor" }
type_associated_const_marked_deprecated = { required-update = "minor" }
type_marked_deprecated = { required-update = "minor" }
type_method_marked_deprecated = { required-update = "minor" }

[patch.crates-io]
# Local sources for the explicitly named, exact-version production forks. Published Krikos crates
# resolve these package names from crates.io; release verification uses packaged candidate sources.
krikos-hickory-server = { path = "vendor/hickory-server-0.26.1" }
krikos-noq = { path = "vendor/noq-1.1.0" }
