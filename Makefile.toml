# Use cargo-make to run tasks here: https://crates.io/crates/cargo-make

[env]
# Make per-member iterations inherit this Makefile so workspace tasks can be
# defined here without needing a per-crate Makefile.toml.
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
# Workspace members to exclude when setting `workspace = true` for a task.
# Must live at global env (not task-level) so it's read before workspace iteration
# is generated. Only the `check-external-types` task uses this.
CARGO_MAKE_WORKSPACE_SKIP_MEMBERS = [
  "examples/local-first-notes",
  "framework/app",
  "integration-tests/local-first-app",
  "krikos/bench",
  "protocols/krikos-blobs",
  "protocols/krikos-docs",
  "protocols/krikos-gossip",
  "protocols/krikos-identity",
  "tools/determinism-checker",
]

[tasks.format]
workspace = false
command = "scripts/run-format.sh"

[tasks.format-check]
workspace = false
command = "scripts/run-format.sh"
args = ["--check"]

[tasks.patchbay]
workspace = false
command = "cargo"
args = ["nextest", "run", "-p", "krikos", "--features", "qlog", "--test", "patchbay", "--profile", "patchbay", "${@}"]

[tasks.check-external-types]
description = "Run cargo check-external-types on workspace crates"
workspace = true
# cargo check-external-types needs a specific nightly toolchain,
# see https://github.com/awslabs/cargo-check-external-types#how-to-use
toolchain = "${TOOLCHAIN:nightly-2026-03-20}"
command = "cargo"
install_crate = false
args = ["check-external-types", "--all-features"]

[tasks.local-first-framework]
description = "Run local-first framework, migration, compatibility, and relay acceptance checks"
workspace = false
command = "scripts/test-local-first-framework.sh"

[tasks.local-first-release-gate]
description = "Prove provisional protocol/framework packages remain unpublished"
workspace = false
command = "python3"
args = ["scripts/check-framework-release-gate.py", "--expect-closed"]

[tasks.identity-release-gate]
description = "Prove krikos-identity remains outside the stable publication set"
workspace = false
command = "python3"
args = ["scripts/check-identity-release-gate.py", "--expect-closed"]
