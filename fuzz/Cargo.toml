[package]
name = "krikos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.91"

[package.metadata]
cargo-fuzz = true

[dependencies]
krikos-dns-server = { path = "../krikos-dns-server", default-features = false, features = ["test-utils"] }
krikos-relay = { path = "../krikos-relay", default-features = false, features = ["fuzzing"] }
krikos-base = { path = "../krikos-base", default-features = false, features = ["key"] }
krikos-gossip = { path = "../protocols/krikos-gossip", default-features = false }
krikos-app = { path = "../framework/app", features = ["fuzzing"] }
krikos-blobs = { path = "../protocols/krikos-blobs", default-features = false }
krikos-docs = { path = "../protocols/krikos-docs", default-features = false }
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[workspace]
members = ["."]

[patch.crates-io]
# Keep fuzzing on the exact ownership/resource forks used by the production workspace.
krikos-hickory-server = { path = "../vendor/hickory-server-0.26.1" }
krikos-noq = { path = "../vendor/noq-1.1.0" }

[[bin]]
name = "doh_extract"
path = "fuzz_targets/doh_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pkarr_body"
path = "fuzz_targets/pkarr_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relay_segmentation"
path = "fuzz_targets/relay_segmentation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_deserialize"
path = "fuzz_targets/config_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gossip_message"
path = "fuzz_targets/gossip_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_manifest"
path = "fuzz_targets/app_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_protocol_registration"
path = "fuzz_targets/app_protocol_registration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_ticket"
path = "fuzz_targets/blob_ticket.rs"
test = false
doc = false
bench = false

[[bin]]
name = "doc_ticket"
path = "fuzz_targets/doc_ticket.rs"
test = false
doc = false
bench = false
