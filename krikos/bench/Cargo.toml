[package]
name = "krikos-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1.11"
hdrhistogram = { version = "7.2", default-features = false }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
krikos = { workspace = true, default-features = false }
krikos-dns = { workspace = true, optional = true }
krikos-dns-server = { workspace = true, features = [
    "test-utils",
], optional = true }
iroh-metrics = { version = "1.0.1", optional = true }
krikos-relay = { workspace = true, features = [
    "server",
    "test-utils",
], optional = true }
n0-future = "0.3"
n0-error = "1.0.0"
noq = { package = "krikos-noq", version = "=1.1.0-holon.1" }
rcgen = "0.14"
rustls = { version = "0.23.33", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10.8", optional = true }
tempfile = { version = "3.23.0", optional = true }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.0", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
] }

[features]
default = ["metrics", "fast-apple-datapath", "tls-ring"]
metrics = ["krikos/metrics", "iroh-metrics"]
local-relay = ["krikos/test-utils"]
resource-canary = [
    "dep:krikos-dns",
    "dep:krikos-dns-server",
    "dep:krikos-relay",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
    "krikos/test-utils",
    "tokio/full",
]
# Use private Apple APIs to send multiple packets in a single syscall.
fast-apple-datapath = ["krikos/fast-apple-datapath", "noq/fast-apple-datapath"]
qlog = ["krikos/qlog", "noq/qlog"]
tls-ring = ["rustls/ring", "krikos/tls-ring"]
tls-aws-lc-rs = ["rustls/aws-lc-rs", "krikos/tls-aws-lc-rs"]

[[bin]]
name = "resource-canary"
path = "src/bin/resource_canary.rs"
required-features = ["resource-canary"]
