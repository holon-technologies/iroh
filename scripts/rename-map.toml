# docs/release/v2-migration.md was considered and deliberately NOT exempted.
# It documents this fork's own v1 -> v2 architecture cut (module paths like
# `iroh_dns::dns`, `iroh_resolver`, `iroh-sim`, `iroh::endpoint`) rather than
# migration from the upstream n0-computer/iroh crate, so most of its `iroh`
# occurrences are internal identifiers that the rebrand is supposed to catch
# and rename (Task 3/7), not upstream references that must survive. A small
# number of genuinely-upstream mentions in that file (the external
# `iroh-mdns-address-lookup` adapter, "Iroh 1.x"/"Iroh v1.0.3" as a compat
# wire-version label) will need individual handling when that file is
# updated -- a blanket exemption here would hide the internal identifiers
# that do need to change, which is the "too broad" failure mode called out
# for this task.
