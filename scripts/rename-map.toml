schema_version = 1

# Krikos rebrand rename map (ADR-0002).
#
# Single source of truth for every old->new package/library/directory pair,
# and for every path where the string `iroh` is CORRECT and must survive the
# rebrand. `scripts/tests/check-rebrand-complete.sh` reads this file and
# drives the completeness gate; `scripts/apply-rebrand.sh` (Task 3) reads it
# to perform the mechanical sweep.
#
# `lib` is the Rust crate identifier used in `use` statements (`[lib] name`
# in the manifest, or Cargo's default of the package name with `-` -> `_`
# when no `[lib]` section overrides it). Verified against every manifest in
# the repository on 2026-07-30 -- see task-1-report.md for the full audit.
# Two crates set an explicit `[lib] name` that already differs from the
# package-name default: `iroh-hickory-server` -> lib `hickory_server` and
# `iroh-noq` -> lib `noq`, both matching their *upstream* crate's lib name so
# downstream `use hickory_server::...` / `use noq::...` code is unaffected by
# which package supplies it. Neither contains the string `iroh`, so neither
# lib identifier changes -- only the package name does.
#
# `dir_renamed = false` means the package is renamed but its directory is
# not, because the directory path does not itself contain the string `iroh`
# (or, for the two vendored forks, because the directory is a byte-verified
# vendored tree that is out of scope for renaming; see check-vendor-provenance.sh).
#
# ORDERING IS LOAD-BEARING, NOT ADVISORY: `[[packages]]` below is sorted by
# `old_package` length, LONGEST FIRST (e.g. `iroh-dns-server` before
# `iroh-dns` before `iroh`). Any textual-substitution consumer (Task 3's
# apply-rebrand.sh) that processes rules in a different order risks a
# shorter rule firing first and corrupting a longer name into something like
# `krikos-dnsserver`. This is not just a comment: `check-rebrand-complete.sh`
# asserts the ordering itself -- it fails if any entry's `old_package` is a
# strict prefix of a *later* entry's `old_package`, so the list cannot drift
# back out of order unnoticed.

