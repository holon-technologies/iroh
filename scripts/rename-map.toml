new_dir = "vendor/hickory-server-0.26.1"
dir_renamed = false
note = "vendored byte-verified tree (check-vendor-provenance.sh); lib name already matches upstream's hickory_server and contains no occurrence of iroh, so it is unchanged. Only the package name field changes, via the checked-in patch (Task 2)."

