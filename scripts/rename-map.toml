[[exemptions]]
pattern = "sims/iroh"
reason = "the relative directory path (inside chuck's mount) to the exempted .github/sims/iroh/ directory, referenced from netsim_runner.yaml's and netsim.yml's sim_paths defaults and its cp destination; must stay consistent with the directory it points at, which is not renamed (see the .github/sims/** path exemption)"

[[exemptions]]
pattern = "bins/iroh-transfer"
reason = "destination filename netsim_runner.yaml copies the transfer example binary to inside chuck's tree, matching the `./bins/iroh-transfer` cmd path the exempted .github/sims/**/*.json scenario files invoke"

[[exemptions]]
pattern = "bins/iroh-relay"
reason = "destination filename netsim_runner.yaml copies the krikos-relay binary to inside chuck's tree, matching the `./bins/iroh-relay` cmd path the exempted .github/sims/**/*.json scenario files invoke"

[[exemptions]]
pattern = "bins/iroh-dns-server"
reason = "destination filename netsim_runner.yaml copies the krikos-dns-server binary to inside chuck's tree, matching the `./bins/iroh-dns-server` cmd path the exempted .github/sims/**/*.json scenario files invoke"

# docs/release/v2-migration.md was considered and deliberately NOT exempted.
# It documents this fork's own v1 -> v2 architecture cut (module paths like
# `iroh_dns::dns`, `iroh_resolver`, `iroh-sim`, `iroh::endpoint`) rather than
# migration from the upstream n0-computer/iroh crate, so most of its `iroh`
# occurrences are internal identifiers that the rebrand is supposed to catch
# and rename (Task 3/7), not upstream references that must survive. A small
# number of genuinely-upstream mentions in that file (the external
# `iroh-mdns-address-lookup` adapter, "Iroh 1.x"/"Iroh v1.0.3" as a compat
# wire-version label) will need individual handling when that file is
# updated -- a blanket exemption here would hide the internal identifiers
# that do need to change, which is the "too broad" failure mode called out
# for this task.
