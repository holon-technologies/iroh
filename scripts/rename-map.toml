# Paths where the string `iroh` (in any case) is CORRECT and must not be
# rewritten. Checked against both the tracked file's path and its content,
# using path-segment-aware glob matching: `*` matches within one path
# segment only and does not cross `/`; `**` matches zero or more whole
# segments. (Plain `fnmatch` would let `*` cross `/`, silently widening
# `vendor/*/src/**` to match e.g. `vendor/x/extra/src/y.rs` -- not what is
# written.) Every exemption must actually match at least one tracked file --
# an exemption matching zero files is either a typo or dead weight, and
# `check-rebrand-complete.sh` fails the run if one is found (this is the
# same defect class as the repository's five prior stale-enumeration bugs,
# just inverted: instead of a check silently no-op'ing on real files, a
# stale exemption would silently no-op on real *violations*).

[[exemptions]]
path = ".github/sims/**"
reason = "sim scenario configs are entirely consumed by the external, pinned-commit-SHA n0-computer/chuck netsim runner (see .github/workflows/netsim_runner.yaml): node `cmd` fields invoke binaries netsim_runner.yaml copies into chuck's own tree under matching iroh-prefixed names, and `parser`/`param_parser`/`integration` fields are registry keys chuck's own code recognizes by these exact strings. Renaming any of it independently of chuck (which this repository does not control and cannot edit) would desync the contract, so the whole directory is treated as chuck-facing configuration -- the same reasoning as compat/**'s upstream-name exemption, just for a different external dependency."

[[exemptions]]
path = "vendor/*/src/**"
reason = "byte-verified against the upstream crates.io package by check-vendor-provenance.sh; nothing here is ever rewritten. NOTE: currently matches 147 tracked files but zero occurrences of `iroh`, because hickory-server, noq and rustls are foreign upstream crates with no inherent reason to mention this project's name -- see task-1-report.md. Kept because it encodes the correct, forward-looking policy boundary, not because it currently suppresses anything."

[[exemptions]]
path = "compat/**"
reason = "interop crates deliberately depend on two sides at once to test wire compatibility across the v1/v2 architecture cut, and the two sides are exempt for different reasons: the `*-v1` Cargo dependency aliases (`iroh-v1`, `iroh-base-v1`, `iroh-dns-v1`, `iroh-relay-v1`, `iroh-blobs-v1`, `iroh-gossip-v1`, ...) pin genuine upstream packages by crates.io version or git rev and are named for the real upstream package on purpose (ADR-0002); the `*-v2`/`*-current` aliases (`iroh-v2`, `iroh-base-current`, `iroh-resolver-current`, `iroh-relay-current`, ...) are local Cargo dependency identifiers that PATH-ALIAS this repository's own renamed krikos-* packages, e.g. `iroh-v2 = { package = \"krikos\", path = \"../../krikos\" }` -- their alias names still say `iroh` only as a label meaning 'the v1/upstream side of this interop pair', not because they reference anything upstream. The whole directory stays exempted because both halves are compat-test wiring this checker should not try to selectively rewrite (renaming only the `-v1` half would misleadingly imply the `-v2`/`-current` half is also upstream, and renaming only the alias identifiers without renaming the crate names inside `*-v1`'s own `package = \"iroh...\"` fields would break the dependency), but the two halves are exempt for opposite reasons and neither reason is 'references upstream' on its own."

[[exemptions]]
path = "docs/upstream/**"
reason = "provenance filenames and records name the upstream packages they were imported from (e.g. commit-maps/iroh-blobs-v0.103.0.tsv)"

[[exemptions]]
path = "protocols/upstream-baselines.toml"
reason = "records upstream provenance (`name`, `source_url`, `tag`, `source_commit`) by the upstream project's own identity, which stays as-is on purpose. `import_prefix`, by contrast, is NOT upstream provenance -- it is the current local path scripts/tests/check-protocol-provenance.sh looks under, so it is kept up to date with the actual renamed directory (protocols/krikos-blobs, protocols/krikos-gossip, protocols/krikos-docs) even though this file's path stays exempt for the `name`/`source_url` fields."

[[exemptions]]
path = "docs/history/**"
reason = "archived upstream changelogs (CHANGELOG.md, CHANGELOG_old.md) are not rewritten"

[[exemptions]]
path = "protocols/*/CHANGELOG.md"
reason = "git-cliff-generated changelogs imported verbatim from upstream n0-computer/iroh-blobs, iroh-gossip, and iroh-docs, covering releases that predate this fork by roughly two years. Every entry quotes a real upstream commit message/PR title and links a real n0-computer/<pkg> commit or issue; those are historical facts about what upstream did, not this fork's own identity, so they read the same way docs/history/** does. Found by code review: an earlier mechanical pass rewrote scopes like `*(iroh-net)*` into `*(krikos-net)*` -- krikos-net has never existed -- because the checker cannot tell 'this crate's own current name' from 'a quoted fact about a different project's PR scope' when both are just the substring iroh. Reverted to the pre-rebrand content verbatim (recovered from commit 40f89f8b33^, the last commit before the corrupting sweep) rather than re-transcribed, and exempted here so it cannot regress the same way twice."

[[exemptions]]
path = "krikos-relay/CHANGELOG.md"
reason = "same defect and same fix as the protocols/*/CHANGELOG.md entry above: this file's `## [1.0.2]`/`## [1.0.3]` sections are git-cliff output imported verbatim from upstream n0-computer/iroh (real commit/issue links under n0-computer/iroh, including a `*(iroh-relay)*` PR-scope label describing upstream's own crate, not this one). Only the current `## Unreleased` section is this fork's own new content, and it does not itself contain the string iroh/krikos, so the whole file reverts to its pre-rebrand content and is exempted, matching docs/history/**'s reasoning."

[[exemptions]]
path = "krikos-dns-server/CHANGELOG.md"
reason = "same defect, same fix, same reasoning as krikos-relay/CHANGELOG.md above -- its `## [1.0.2]`/`## [1.0.3]` sections are verbatim-imported upstream n0-computer/iroh history (including a `*(iroh-dns-server)*` PR-scope label naming upstream's own crate)."

[[exemptions]]
path = "krikos-base/CHANGELOG.md"
reason = "same defect and fix as krikos-relay/CHANGELOG.md above, found during the follow-up hunt for the same corruption class rather than in the original review: its `## [1.0.2]`/`## [1.0.3]` sections are verbatim-imported upstream n0-computer/iroh history for the iroh-base package. The `## Unreleased` section is this fork's own new content and does not itself mention iroh/krikos, so nothing of this fork's own is lost by exempting and reverting the whole file."

[[exemptions]]
path = "krikos-dns/CHANGELOG.md"
reason = "same defect, fix, and discovery path as krikos-base/CHANGELOG.md above -- verbatim-imported upstream n0-computer/iroh history for the iroh-dns package under `## [1.0.2]`/`## [1.0.3]`, with an unaffected fork-authored `## Unreleased` section above it."

# krikos-resolver/CHANGELOG.md and krikos-runtime/CHANGELOG.md were considered for the same
# exemption and deliberately excluded: both crates are new, never existed upstream, and their
# CHANGELOG.md content is entirely this fork's own `## Unreleased` prose (no imported
# `## [x.y.z]` section, no n0-computer/iroh commit/issue links). Their `iroh`->`krikos`
# rewrites (including the self-descriptive "production Iroh"/"production Krikos" sentence in
# krikos-runtime/CHANGELOG.md) are correct renames of this fork's own text, not a
# misattribution -- exempting them would hide a real future violation instead of protecting a
# genuine historical record, the same "too broad" failure mode called out for
# docs/release/v2-migration.md below.

[[exemptions]]
path = "LICENSE-*"
reason = "upstream copyright attribution at the repository root. NOTE: currently matches 2 tracked files (LICENSE-APACHE, LICENSE-MIT) but neither contains the string iroh today -- kept for the same forward-looking reason as the vendor/src exemption."

[[exemptions]]
path = "docs/adr/0001-local-first-application-framework-monorepo.md"
reason = "Architecture Decision Records are historical: they document the reasoning and the state of the world at the time a decision was accepted, and are not rewritten after acceptance. This ADR names iroh/iroh-* packages and the upstream n0-computer/iroh-* repositories as part of that historical record. Pinned to this exact filename (not a docs/adr/*.md blanket) so a future ADR cannot inherit the exemption invisibly -- each ADR that legitimately needs it must be added explicitly."

[[exemptions]]
path = "docs/adr/0002-krikos-rebrand.md"
reason = "the decision record for this very rebrand: it names iroh/iroh-* packages, the upstream n0-computer/iroh repository, and crates.io ownership as part of the historical record explaining why the rename happened; rewriting it would erase the decision it documents. Pinned to this exact filename for the same reason as 0001, above."

[[exemptions]]
path = "docs/release/krikos-migration.md"
reason = "the migration guide for downstream consumers moving from upstream iroh to Krikos (.superpowers plan Task 7 / ADR-0002's 'Migration' consequence section). Its entire content is the old->new package/import/env-var mapping and a worked before/after code example that shows both sides -- rewriting the 'before' (upstream) side to say krikos would make the guide describe migrating from krikos to krikos, i.e. nothing. Same reasoning as the docs/adr/0001 and 0002 exemptions below: a document whose value is naming the old identifiers accurately is not a rename target. Pinned to this exact filename, not a docs/release/*.md blanket, so a future release doc cannot inherit the exemption invisibly."

[[exemptions]]
path = "scripts/rename-map.toml"
reason = "this file. It records old_package/old_lib/old_dir/exemption-path values verbatim as data for check-rebrand-complete.sh and apply-rebrand.sh to read; rewriting them in place would delete the mapping the rest of the plan depends on."

[[exemptions]]
path = "scripts/tests/check-rebrand-complete.sh"
reason = "the completeness checker's own source necessarily contains the literal search term it looks for, the same way a profanity filter's source contains the words it filters"

[[exemptions]]
path = "scripts/tests/check-rebrand-unknown-crates.sh"
reason = "the unknown-krikos-token checker's own source cites the specific falsified strings (krikos-net, krikos-util, krikos-tor, krikos-net-report, krikos-willow) that motivated writing it, the same way check-rebrand-complete.sh's self-exemption above does."

# --- Pattern exemptions ------------------------------------------------
# Literal substrings that are correct wherever they occur, in files that
# otherwise carry ordinary renamable content (so a whole-file `path`
# exemption would hide real violations on other lines of the same file).
# Each `pattern` is matched as a plain, case-sensitive substring; every
# non-overlapping occurrence anywhere in a tracked file's content is masked
# before that file's lines are checked for any remaining, uncovered `iroh`.

[[exemptions]]
pattern = "iroh-metrics-derive"
reason = "crates.io package name of n0's real, external telemetry-derive dependency (Cargo.lock); not part of this rename's package set"

[[exemptions]]
pattern = "iroh-metrics"
reason = "crates.io package name of n0's real, external telemetry dependency, depended on by krikos, krikos-relay, krikos-dns-server, krikos-bench and the protocol crates; not part of this rename's package set"

[[exemptions]]
pattern = "iroh_metrics"
reason = "Rust identifier form of the iroh-metrics dependency above (`use iroh_metrics::...`, intra-doc links, and the local `record_iroh_metrics` helper named after it)"

[[exemptions]]
pattern = "iroh-io"
reason = "crates.io package name of n0's real, external async-IO dependency used by protocols/krikos-blobs; not part of this rename's package set"

[[exemptions]]
pattern = "iroh_io"
reason = "Rust identifier form of the iroh-io dependency above (`use iroh_io::...`)"

[[exemptions]]
pattern = "iroh-test(?!-env)"
reason = "crates.io package name of n0's real, external test-utilities dependency used by protocols/krikos-blobs (also incidentally covers the unrelated internal `x-iroh-test-hold-millis` canary header, a harmless over-match); not part of this rename's package set"

[[exemptions]]
pattern = "iroh_test"
reason = "Rust identifier form of the iroh-test dependency above (`use iroh_test::...`; also incidentally covers the internal `/__iroh_test/hold` canary route, a harmless over-match)"

[[exemptions]]
pattern = "/iroh-gossip/1"
reason = "GOSSIP_ALPN, the QUIC ALPN protocol identifier protocols/krikos-gossip negotiates connections with. This is wire protocol, not naming: compat/iroh-gossip-v0-101-interop/src/main.rs asserts `iroh_gossip_v1::ALPN == iroh_gossip_v2::ALPN` by name (\"gossip ALPN changed\") -- upstream and this fork's gossip endpoints must offer the identical ALPN to negotiate a connection at all, so renaming the byte string (not just the Rust identifier around it) would break that proven, tested compatibility guarantee, which ADR-0002 forbids changing."

[[exemptions]]
pattern = "/iroh-bytes/4"
reason = "the QUIC ALPN protocol identifier protocols/krikos-blobs negotiates connections with. Same wire-protocol reasoning as /iroh-gossip/1: compat/iroh-blobs-v0-103-interop/src/main.rs connects a v1 (upstream) endpoint to a v2 (this fork) endpoint and vice versa using each side's own `::ALPN` constant to dial the other, which only succeeds if the two are byte-identical. Confirmed by mutation: krikos-blobs's own unit test suite (105 tests) does not notice this value changing at all (both sides of every in-process test are the same build, so they agree with themselves regardless), but scripts/tests/check-blobs-v0-interop.sh -- which actually builds and runs against a real, separately-compiled upstream v0.103.0 crate -- fails with a QUIC ALPN negotiation error when this literal is mutated. The guarantee is real; it is proven by that interop process test, not by the crate's own unit tests."

[[exemptions]]
pattern = "/iroh-sync/1"
reason = "the QUIC ALPN protocol identifier protocols/krikos-docs negotiates connections with; kept unrenamed for the same wire-protocol reasoning as /iroh-gossip/1 and /iroh-bytes/4 -- it is one of the same three imported protocol crates (blobs, gossip, docs), just without its own compat/*-interop crate yet, so nothing currently exercises it, but its ALPN is exactly the kind of external-negotiation identifier ADR-0002's wire-protocol guarantee covers."

[[exemptions]]
pattern = "/iroh-qad/0"
reason = "ALPN_QUIC_ADDR_DISC, the relay's QUIC address-discovery ALPN identifier. Relay wire compatibility with upstream v1.0.3 is an explicit ADR-0002 guarantee; this is part of that wire protocol, not a name."

[[exemptions]]
pattern = "iroh/resource-canary/1"
reason = "CANARY_ALPN, the ALPN krikos/bench's production resource canaries connect with; per the root README these are \"production resource canaries\" (ongoing operational monitoring), so this is treated as a live wire identifier rather than a benchmark-only convenience name, consistent with the other ALPN exemptions above."

[[exemptions]]
pattern = "iroh-blobs-v0-103-interop"
reason = "the compat/** interop crate's actual directory and package name (see rename-map.toml's [[not_renamed]] entry for it -- it tests against the upstream iroh-blobs package by its upstream name on purpose). References to it from outside compat/** (root Cargo.toml workspace.exclude, .github/workflows/ci.yml, scripts/tests/check-blobs-v0-interop.sh, scripts/apply-rebrand.sh) must keep pointing at the real, unrenamed path."

[[exemptions]]
pattern = "iroh-gossip-v0-101-interop"
reason = "the compat/** interop crate's actual directory and package name (see rename-map.toml's [[not_renamed]] entry for it); same reasoning as iroh-blobs-v0-103-interop above -- references from outside compat/** must keep pointing at the real, unrenamed path."

[[exemptions]]
pattern = "iroh-blobs-v0\\.103\\.0\\.tsv"
reason = "the real, correctly upstream-named filename of the commit-provenance map at docs/upstream/commit-maps/iroh-blobs-v0.103.0.tsv (itself covered by the docs/upstream/** path exemption above, since a provenance record's filename names the upstream release it maps). protocols/krikos-blobs/UPSTREAM.md links to it by relative path from outside docs/upstream/**, so this pattern covers that one reference site. Found by code review: an earlier pass had rewritten the link's text and href to `krikos-blobs-v0.103.0.tsv`, a file that has never existed, breaking the link -- the fix corrects the link, not the (correctly named) target file."

[[exemptions]]
pattern = "iroh-docs-v0\\.101\\.0\\.tsv"
reason = "same defect, fix, and reasoning as iroh-blobs-v0.103.0.tsv above, for protocols/krikos-docs/UPSTREAM.md's link to docs/upstream/commit-maps/iroh-docs-v0.101.0.tsv."

[[exemptions]]
pattern = "iroh-gossip-v0\\.101\\.0\\.tsv"
reason = "same defect, fix, and reasoning as iroh-blobs-v0.103.0.tsv above, for protocols/krikos-gossip/UPSTREAM.md's link to docs/upstream/commit-maps/iroh-gossip-v0.101.0.tsv."

[[exemptions]]
pattern = "iroh-relay handshake v1"
reason = "cryptographic domain-separation labels in krikos-relay/src/protos/handshake.rs (DOMAIN_SEP_TLS_EXPORT_LABEL, fed to TLS export_keying_material, and DOMAIN_SEP_CHALLENGE, which this pattern also covers as a prefix, fed to blake3::derive_key for the challenge signature). These are wire bytes, not names, and are part of the relay wire-compatibility guarantee ADR-0002 says this rebrand must not break. Mutation-tested individually: renaming DOMAIN_SEP_CHALLENGE is caught by `handshake_frames_match_v1_0_3_fixtures` (a real byte comparison against a recorded upstream v1.0.3 fixture) failing. Renaming DOMAIN_SEP_TLS_EXPORT_LABEL alone is NOT caught by that test or by the rest of the local krikos-relay test suite -- the test's `GoldenExporter` stub asserts the exporter was called with the `DOMAIN_SEP_TLS_EXPORT_LABEL` constant itself rather than independently deriving and comparing real exported key material, so it cannot detect the constant and the assertion changing together. The exemption is still correct (this is a real TLS exporter label, and an incorrect one would fail to interoperate with any real upstream-speaking peer at the TLS layer even though nothing local proves it), but no claim is made here that a test currently catches it -- it does not."

[[exemptions]]
pattern = "iroh 0\\.98\\.0"
reason = "historical fact about the real upstream project: upstream iroh introduced the V2 relay frame set at its own version 0.98.0, before this fork existed. The ProtocolVersion doc comments in krikos-relay/src/http.rs record when each version was introduced upstream, not a claim about this fork's own version history."

[[exemptions]]
pattern = "x-iroh-relay-client-auth-v1"
reason = "CLIENT_AUTH_HEADER, the HTTP header name krikos-relay's client authentication uses (krikos-relay/src/http.rs). This is wire protocol, not naming -- docs/relay-compatibility.md and scripts/tests/check-relay-compatibility.sh pin it as the normative contract value alongside the other HTTP/negotiation constants, and krikos-relay/tests/wire_compat.rs asserts the constant's value directly (`assert_eq!(CLIENT_AUTH_HEADER.as_str(), \"x-iroh-relay-client-auth-v1\")`), so a rename is caught immediately by that test as well as by the checker's require_text assertions."

[[exemptions]]
pattern = "iroh-relay-v1"
reason = "ProtocolVersion::V1's wire subprotocol string (krikos-relay/src/http.rs, sent as the WebSocket `Sec-WebSocket-Protocol` header during relay negotiation and parsed back on the receiving side). Pinned by docs/relay-compatibility.md's normative contract table and asserted directly by krikos-relay/tests/wire_compat.rs (`assert_eq!(ProtocolVersion::V1.to_str(), \"iroh-relay-v1\")`) and scripts/tests/check-relay-compatibility.sh. compat/relay-v1-interop/src/main.rs independently hardcodes the same literal to force this subprotocol against a real upstream v1.0.3 relay, which only works if the value matches exactly."

[[exemptions]]
pattern = "iroh-relay-v2"
reason = "ProtocolVersion::V2's wire subprotocol string; same reasoning and same three-way pinning (contract doc, wire_compat.rs assertion, compat/relay-v1-interop's independent literal) as iroh-relay-v1 above."

[[exemptions]]
pattern = "X_IROH_ENDPOINT_ID"
reason = "the Rust constant name (krikos-relay/src/http.rs, exported as pub so krikos-relay/tests/wire_compat.rs can assert its value directly) for the X-Iroh-NodeId wire header below; kept matching upstream's own identifier name for this constant, not just its value, since there is no reason for it to diverge and every reason for it to stay recognizable against upstream's source."

[[exemptions]]
pattern = "X-Iroh-NodeId"
reason = "the HTTP header krikos-relay sends to an operator-configured, third-party HTTP access-control service to identify the connecting endpoint (krikos-relay/src/main.rs's http_access_check_inner). This is wire protocol the relay operator's external service was built against upstream's header name, not this fork's; renaming it produces a silent authorization failure for any operator pointing an existing upstream-compatible access service at this relay -- the service simply never sees the header it is looking for. Found in review round 2: the mechanical rename had renamed this value with no local test noticing, exactly as it had for the other relay headers. Now asserted by krikos-relay/tests/wire_compat.rs, docs/relay-compatibility.md, and scripts/tests/check-relay-compatibility.sh, all proven to fail on a deliberate re-break and restored."

[[exemptions]]
pattern = "X-Iroh-Challenge"
reason = "NO_CONTENT_CHALLENGE_HEADER, an HTTP header krikos-relay's captive-portal detection route emits and krikos/src/net_report/reportgen.rs independently hardcodes the identical literal to read back while probing relays -- including, by default, n0's real production relays (see the iroh.link exemption). Both sides currently agree with each other regardless of the literal's spelling because krikos-relay/src/server/tests.rs asserts against the same Rust constant rather than an independent copy, so nothing local would catch the two literals drifting from a real external relay's expectation; kept at its upstream v1.0.3 value on that basis, not because a local test proves it."

[[exemptions]]
pattern = "X-Iroh-Response"
reason = "NO_CONTENT_RESPONSE_HEADER; same reasoning, same two independent-literal call sites (krikos-relay/src/server/routes.rs and krikos/src/net_report/reportgen.rs), and the same lack of local test coverage as X-Iroh-Challenge above."

