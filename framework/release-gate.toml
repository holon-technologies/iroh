# Blocks the four framework packages below from being published.
#
# What each approval requires, what evidence satisfies it, and who decides:
# docs/framework/release-gate.md. Enforced by
# scripts/check-framework-release-gate.py (--expect-closed in CI today).
#
# Do not flip an approval to true without recording its evidence, and do not
# open the gate without also switching CI to --require-open -- see the
# "Opening the gate" section of that document.
schema_version = 1
status = "blocked"

[approvals]
package_naming = false
registry_ownership = false
public_api_baseline = false
data_schema_support = false

[[packages]]
order = 1
name = "krikos-blobs"
path = "protocols/krikos-blobs"

[[packages]]
order = 2
name = "krikos-gossip"
path = "protocols/krikos-gossip"

[[packages]]
order = 3
name = "krikos-docs"
path = "protocols/krikos-docs"

[[packages]]
order = 4
name = "krikos-app"
path = "framework/app"
