[package]
name = "krikos-app"
version.workspace = true
edition.workspace = true
description = "Experimental local-first application lifecycle for Krikos"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
fuzzing = []
identity = ["dep:krikos-identity"]

[lints]
workspace = true

[dependencies]
krikos = { workspace = true, default-features = false, features = ["tls-ring"] }
krikos-base = { workspace = true, features = ["key"] }
krikos-blobs = { workspace = true, default-features = false, features = ["fs-store"] }
krikos-docs = { workspace = true, features = ["fs-store"] }
krikos-gossip = { workspace = true, default-features = false, features = ["net"] }
krikos-identity = { workspace = true, default-features = false, features = ["net"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[example]]
name = "identity"
required-features = ["identity"]
