[package]
name = "krikos-dns"
version.workspace = true
edition.workspace = true
description = "DNS-based endpoint discovery for iroh"
license.workspace = true
authors = ["n0 team"]
repository.workspace = true
keywords = ["networking", "pkarr", "dns", "iroh"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
derive_more = { version = "2.0.1", features = ["debug"] }
krikos-base = { workspace = true, default-features = false, features = ["key", "relay"] }
n0-error = "1.0.0"
n0-future = "0.3"
portable-atomic = "1"
simple-dns = "0.11"
strum = { version = "0.28", features = ["derive"] }
url = "2.5.3"

# Native DNS uses sockets and the host resolver configuration. Browser builds retain endpoint
# record parsing and HTTP-based discovery without compiling the native resolver stack.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
krikos-resolver.workspace = true

[build-dependencies]
cfg_aliases = "0.2.2"

[features]
default = []
tls-ring = ["krikos-resolver/tls-ring"]
tls-aws-lc-rs = ["krikos-resolver/tls-aws-lc-rs"]

[dev-dependencies]
n0-tracing-test = "0.3"
hickory-resolver = { version = "0.26.0", features = ["tokio", "system-config"] }
tokio = { version = "1", features = ["macros", "rt"] }

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "krikos_base::*",
    "krikos_resolver::*",
    "n0_error::*",
    "url::*",
]
