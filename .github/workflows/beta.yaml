# Run tests using the beta Rust compiler

name: Beta Rust

on:
  schedule:
    # 04:50 UTC every Monday
    - cron: '50 4 * * 1'
  workflow_dispatch:

concurrency:
  group: beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  tests:
    uses: './.github/workflows/tests.yaml'
    with:
      rust-version: beta
  report:
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Record beta result
        run: |
          result=$(echo '${{ toJSON(needs) }}' | jq -r .tests.result)
          {
            echo "## Rust beta validation"
            echo
            echo "Result: **$result**"
            echo
            echo "[Open this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
