name: Release containers

on:
  workflow_call:
    inputs:
      release_version:
        description: "Release tag used for image tags"
        required: true
        type: string
      base_hash:
        description: "Pinned 40-character commit SHA used for source metadata"
        required: true
        type: string
      publish:
        description: "Publish images to GHCR"
        required: false
        type: boolean
        default: false
      mark_latest:
        description: "Also publish the mutable latest tag"
        required: false
        type: boolean
        default: false

jobs:
  build_and_publish:
    name: Build multi-platform containers
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_hash }}

      - name: Download musl release bundles
        uses: actions/download-artifact@v7
        with:
          pattern: iroh-*-linux-musl-bundle
          path: release-bundles

      - name: Prepare immutable container inputs
        shell: bash
        run: |
          set -euo pipefail
          prepare_arch() {
            local target=$1
            local platform=$2
            local archive
            archive=$(find release-bundles -type f -name "iroh-*-$target.tar.gz" -print -quit)
            if [[ -z "$archive" ]]; then
              echo "::error::missing musl release bundle for $target"
              exit 2
            fi
            mkdir -p "bins/$platform" "extract/$target"
            tar -xzf "$archive" -C "extract/$target"
            install -m 0755 "extract/$target/iroh-relay" "bins/$platform/iroh-relay"
            install -m 0755 "extract/$target/iroh-dns-server" "bins/$platform/iroh-dns-server"
          }
          prepare_arch x86_64-unknown-linux-musl linux/amd64
          prepare_arch aarch64-unknown-linux-musl linux/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build iroh-relay container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          target: iroh-relay
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ inputs.publish }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/holon-technologies/iroh-relay:${{ inputs.release_version }}
            ${{ inputs.mark_latest && 'ghcr.io/holon-technologies/iroh-relay:latest' || '' }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.base_hash }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build iroh-dns-server container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          target: iroh-dns-server
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ inputs.publish }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/holon-technologies/iroh-dns-server:${{ inputs.release_version }}
            ${{ inputs.mark_latest && 'ghcr.io/holon-technologies/iroh-dns-server:latest' || '' }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.base_hash }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
