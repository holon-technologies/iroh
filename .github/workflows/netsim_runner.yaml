name: netsim-runner

on:
  workflow_dispatch:
    inputs:
      iroh_ref:
        description: "Pinned 40-character Iroh commit SHA"
        required: true
        type: string
      max_workers:
        required: false
        type: number
        default: 4
      netsim_ref:
        description: "Pinned 40-character commit SHA from n0-computer/chuck"
        required: false
        type: string
        default: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      rust_log:
        description: "Custom RUST_LOG value (e.g. 'iroh=debug,noq=trace'). If empty, defaults to warn."
        required: false
        type: string
        default: ""
      build_profile:
        required: false
        type: string
        default: "release"
      sim_paths:
        required: false
        type: string
        default: "sims/iroh,sims/integration"
      pr_number:
        required: false
        type: string
        default: ""
      report_table:
        required: false
        type: boolean
        default: false
      filter:
        description: "Test filter: 'skip:test1,test2' to exclude or 'only:test1,test2' to run exclusively"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      iroh_ref:
        description: "Pinned 40-character Iroh commit SHA"
        required: true
        type: string
      max_workers:
        required: false
        type: number
        default: 4
      netsim_ref:
        description: "Pinned 40-character commit SHA from n0-computer/chuck"
        required: false
        type: string
        default: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      rust_log:
        description: "Custom RUST_LOG value (e.g. 'iroh=debug,noq=trace'). If empty, defaults to warn."
        required: false
        type: string
        default: ""
      build_profile:
        required: false
        type: string
        default: "release"
      sim_paths:
        required: false
        type: string
        default: "sims/iroh,sims/integration"
      pr_number:
        required: false
        type: string
        default: ""
      report_table:
        required: false
        type: boolean
        default: false
      filter:
        description: "Test filter: 'skip:test1,test2' to exclude or 'only:test1,test2' to run exclusively. No prefix defaults to only."
        required: false
        type: string
        default: ""

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  MSRV: "1.66"
  SCCACHE_GHA_ENABLED: "on"
  RUSTC_WRAPPER: "sccache"
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  netsim:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Netsim
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
    - name: Validate immutable Iroh input
      env:
        IROH_REF: ${{ inputs.iroh_ref }}
      run: |
        if [[ ! "$IROH_REF" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::iroh_ref must be a pinned 40-character lowercase commit SHA"
          exit 2
        fi

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: ${{ inputs.iroh_ref }}

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      continue-on-error: true
    - uses: ./.github/actions/sccache-probe

    - name: Build iroh
      run: |
        cargo build --profile ${{ inputs.build_profile }} --workspace --all-features --examples --bins

    - name: Fetch netsim
      env:
        NETSIM_REF: ${{ inputs.netsim_ref }}
      run: |
        if [[ ! "$NETSIM_REF" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::netsim_ref must be a pinned 40-character lowercase commit SHA"
          exit 2
        fi
        mkdir ../chuck
        git -C ../chuck init
        git -C ../chuck remote add origin https://github.com/n0-computer/chuck.git
        git -C ../chuck fetch --depth 1 origin "$NETSIM_REF"
        git -C ../chuck checkout --detach FETCH_HEAD

    - name: Install netsim deps
      run: |
        cd ../chuck/netsim
        sudo apt update
        ./setup.sh
        netsim_pythonpath=$(python3 -c 'import site; print(site.getusersitepackages())')
        echo "NETSIM_PYTHONPATH=$netsim_pythonpath" >> "$GITHUB_ENV"
        sudo env PYTHONPATH="$netsim_pythonpath" python3 -c 'import humanfriendly, pyshark'
        ./cleanup.sh || true

    - name: Copy sim configs
      run: |
        cp -r .github/sims/iroh/ ../chuck/netsim/sims/iroh/
        cp -r .github/sims/integration/ ../chuck/netsim/sims/integration/
        cp -r .github/sims/paused/ ../chuck/netsim/sims/paused/

    - name: Copy binaries to right location
      run: |
        cp target/${{inputs.build_profile}}/examples/* ../chuck/netsim/bins/
        cp target/${{inputs.build_profile}}/examples/transfer ../chuck/netsim/bins/iroh-transfer
        cp target/${{inputs.build_profile}}/iroh-relay ../chuck/netsim/bins/iroh-relay
        cp target/${{inputs.build_profile}}/iroh-dns-server ../chuck/netsim/bins/iroh-dns-server

    - name: Get commit sha
      shell: bash
      run: |
        echo "LAST_COMMIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

    - name: Run tests
      id: run_tests
      continue-on-error: true
      env:
        FILTER_INPUT: ${{ inputs.filter }}
        MAX_WORKERS: ${{ inputs.max_workers }}
        RUST_LOG_INPUT: ${{ inputs.rust_log }}
        SIM_PATHS_INPUT: ${{ inputs.sim_paths }}
      run: |
        cd ../chuck/netsim
        IFS=',' read -r -a sim_paths <<< "$SIM_PATHS_INPUT"
        filter_args=()
        if [[ -n "$FILTER_INPUT" ]]; then
          if [[ "$FILTER_INPUT" == skip:* ]]; then
            filter_args=("--skip=${FILTER_INPUT#skip:}")
          elif [[ "$FILTER_INPUT" == only:* ]]; then
            filter_args=("--only=${FILTER_INPUT#only:}")
          else
            filter_args=("--only=$FILTER_INPUT")
          fi
        fi
        for sim_path in "${sim_paths[@]}"; do
          if [[ -n "$RUST_LOG_INPUT" ]]; then
            sudo env PYTHONPATH="$NETSIM_PYTHONPATH" RUST_LOG="$RUST_LOG_INPUT" \
              python3 main.py "${filter_args[@]}" "--max-workers=$MAX_WORKERS" --integration "$sim_path"
          else
            sudo env PYTHONPATH="$NETSIM_PYTHONPATH" \
              python3 main.py "${filter_args[@]}" "--max-workers=$MAX_WORKERS" --integration "$sim_path"
          fi
        done

    - name: Generate report
      id: generate_report
      if: always()
      run: |
        cd ../chuck/netsim
        python3 reports_csv.py --table > report_table.txt
        python3 reports_csv.py --prom --commit ${{ env.LAST_COMMIT_SHA }} > report_prom.txt
        python3 reports_csv.py --metro --commit ${{ env.LAST_COMMIT_SHA }} > report_metro.txt
        python3 reports_csv.py --metro --integration --commit ${{ env.LAST_COMMIT_SHA }} > report_metro_integration.txt

    - name: Package report
      if: always()
      run: |
        cd ../chuck/netsim
        report_paths=(
          report_prom.txt
          report_table.txt
          report_metro.txt
          report_metro_integration.txt
        )
        for path in logs report viz; do
          if [[ -e "$path" ]]; then
            report_paths+=("$path")
          fi
        done
        tar -czf "$GITHUB_WORKSPACE/report.tar.gz" "${report_paths[@]}"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      id: upload-report
      with:
        name: netsim-report-${{ env.LAST_COMMIT_SHA }}
        path: report.tar.gz
        retention-days: 3
        overwrite: true

    - name: Fail Job if Tests Failed
      if: ${{ steps.run_tests.outcome == 'failure' }}
      run: |
        echo "Tests failed. Report: ${{steps.upload-report.outputs.artifact-url}}"
        echo ""
        if [ -f ../chuck/netsim/logs/failed_tests.txt ]; then
          echo "=== FAILED TESTS ==="
          cat ../chuck/netsim/logs/failed_tests.txt
        fi
        exit 1

    - name: Find Docs Comment
      if: ${{ inputs.pr_number != '' }}
      uses: peter-evans/find-comment@v4
      id: fc
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-author: 'github-actions[bot]'
        body-includes: Netsim report & logs for this PR have been generated

    - name: Create or Update Docs Comment
      if: ${{ inputs.pr_number != '' && !github.event.pull_request.head.repo.fork }}
      uses: peter-evans/create-or-update-comment@v5
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        body: |
          Netsim report & logs for this PR have been generated and is available at: [LOGS](${{steps.upload-report.outputs.artifact-url}})
          This report will remain available for 3 days.

          Last updated for commit: ${{ env.LAST_COMMIT_SHA }}
        edit-mode: replace

    - name: Generate report table
      if: ${{ inputs.pr_number != '' && inputs.report_table}}
      id: generate_report_table
      run: |
        cd ../chuck/netsim
        netsim_report=$(cat report_table.txt)
        {
          echo "NETSIM_REPORT<<EOFMARKER"
          echo "$netsim_report"
          echo "EOFMARKER"
        } >> "$GITHUB_OUTPUT"

    - name: Echo Report Table on PR
      uses: peter-evans/create-or-update-comment@v5
      if: ${{ inputs.pr_number != '' && inputs.report_table && !github.event.pull_request.head.repo.fork }}
      with:
        issue-number: ${{ inputs.pr_number }}
        body: |
          `${{ inputs.iroh_ref }}.${{ env.LAST_COMMIT_SHA }}`
          Perf report:
          ${{ steps.generate_report_table.outputs.NETSIM_REPORT }}

    - name: Echo metrics (debug)
      run: |
        cd ../chuck/netsim
        d=$(cat report_metro.txt)
        metro_data=$(printf "%s\n " "$d")
        echo "$metro_data"
        d=$(cat report_metro_integration.txt)
        metro_data=$(printf "%s\n " "$d")
        echo "$metro_data"

    - name: Cleanup
      if: always()
      run: |
        (cd ../chuck/netsim && sudo ./cleanup.sh) || true
