name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag (for example, v2.0.0)"
        required: true
        type: string
      base_hash:
        description: "Pinned 40-character commit SHA to build"
        required: true
        type: string
      create_release:
        description: "Create a draft GitHub release and tag"
        required: false
        type: boolean
        default: false
      publish_containers:
        description: "Publish versioned containers to GHCR"
        required: false
        type: boolean
        default: false
      mark_latest:
        description: "Mark the draft release as latest when it is published"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.release_version }}-${{ inputs.base_hash }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  preflight:
    name: Validate immutable release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_hash: ${{ steps.validate.outputs.base_hash }}
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_hash }}

      - name: Validate release version, commit, and package versions
        id: validate
        env:
          BASE_HASH: ${{ inputs.base_hash }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_version must be a semantic version prefixed with v"
            exit 2
          fi
          if [[ ! "$BASE_HASH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::base_hash must be a pinned 40-character lowercase commit SHA"
            exit 2
          fi

          actual_hash=$(git rev-parse HEAD)
          if [[ "$actual_hash" != "$BASE_HASH" ]]; then
            echo "::error::checkout resolved to $actual_hash instead of $BASE_HASH"
            exit 2
          fi
          echo "base_hash=$actual_hash" >> "$GITHUB_OUTPUT"

          crate_version=${RELEASE_VERSION#v}
          cargo metadata --format-version 1 --no-deps |
            jq -e --arg expected "$crate_version" '
              [.packages[]
                | select(.name == "iroh"
                    or .name == "iroh-base"
                    or .name == "iroh-resolver"
                    or .name == "iroh-dns"
                    or .name == "iroh-dns-server"
                    or .name == "iroh-relay"
                    or .name == "iroh-runtime")]
              | length == 7 and all(.version == $expected)
            '
          cargo metadata --format-version 1 --no-deps \
            --manifest-path vendor/noq-1.1.0/Cargo.toml |
            jq -e '.packages | length == 1 and .[0].name == "iroh-noq" and .[0].version == "1.1.0-holon.1"'
          cargo metadata --format-version 1 --no-deps \
            --manifest-path vendor/hickory-server-0.26.1/Cargo.toml |
            jq -e '.packages | length == 1 and .[0].name == "iroh-hickory-server" and .[0].version == "0.26.1-holon.1"'

          if [[ "$CREATE_RELEASE" == "true" ]] &&
             git ls-remote --exit-code origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::tag $RELEASE_VERSION already exists"
            exit 2
          fi

  simulation_release_readiness:
    name: Require simulation release evidence
    needs: preflight
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.preflight.outputs.base_hash }}

      - name: Check candidate simulation release evidence
        id: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_root="$RUNNER_TEMP/simulation-release"
          report="$report_root/release-readiness.json"
          mkdir -p "$report_root"
          now_unix_secs=$(date +%s)
          set +e
          scripts/check-simulation-release-readiness.sh \
            --repository "${{ github.repository }}" \
            --revision "${{ needs.preflight.outputs.base_hash }}" \
            --now-unix-secs "$now_unix_secs" \
            --policy iroh-sim/operations-policy.json \
            --output "$report"
          readiness_status=$?
          set -e
          if [[ ! -f "$report" ]]; then
            jq -n \
              --arg revision "${{ needs.preflight.outputs.base_hash }}" \
              --argjson observed_at_unix_secs "$now_unix_secs" \
              --argjson exit_code "$readiness_status" \
              '{
                schema_version: 1,
                status: "infrastructure_failure",
                reason: "readiness checker exited before publishing its typed report",
                revision: $revision,
                observed_at_unix_secs: $observed_at_unix_secs,
                checker_exit_code: $exit_code
              }' >"$report"
            readiness_status=2
          fi
          echo "status=$readiness_status" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Retain simulation release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: simulation-release-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/simulation-release/release-readiness.json
          if-no-files-found: error
          retention-days: 14

      - name: Propagate simulation release readiness
        if: always()
        shell: bash
        run: |
          readiness_status="${{ steps.readiness.outputs.status }}"
          report="$RUNNER_TEMP/simulation-release/release-readiness.json"
          if [[ ! "$readiness_status" =~ ^[0-2]$ ]] \
            || ! jq -e \
              --arg revision "${{ needs.preflight.outputs.base_hash }}" \
              '.schema_version == 1 and .revision == $revision' \
              "$report" >/dev/null; then
            echo "simulation release readiness did not publish valid evidence" >&2
            exit 2
          fi
          if [[ "$readiness_status" -eq 0 ]]; then
            jq -e '.status == "release_ready"' "$report" >/dev/null
          elif [[ "$readiness_status" -eq 1 ]]; then
            jq -e '.status == "release_blocked"' "$report" >/dev/null
          else
            jq -e '.status == "infrastructure_failure"' "$report" >/dev/null
          fi
          exit "$readiness_status"

  build_release:
    name: Build ${{ matrix.target }}
    needs: [preflight, simulation_release_readiness]
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.preflight.outputs.base_hash }}
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: contains(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_TARGET" == *-musl ]]; then
            linker_var="CARGO_TARGET_${BUILD_TARGET}_LINKER"
            linker_var=${linker_var^^}
            linker_var=${linker_var//-/_}
            export "$linker_var=musl-gcc"
            export CC=musl-gcc
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static -C relocation-model=static -C link-arg=-static"
          fi
          cargo build \
            --profile optimized-release \
            --all-features \
            --target "$BUILD_TARGET" \
            -p iroh-relay \
            -p iroh-dns-server

      - name: Smoke-test release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target_dir="target/${{ matrix.target }}/optimized-release"
          "$target_dir/iroh-relay" --version
          "$target_dir/iroh-dns-server" --version

      - name: Smoke-test release binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "target/${{ matrix.target }}/optimized-release/iroh-relay.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "target/${{ matrix.target }}/optimized-release/iroh-dns-server.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build archive and checksum
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_VERSION#v}
          bundle="iroh-$version-${{ matrix.target }}"
          mkdir -p "dist/$bundle"
          cp "target/${{ matrix.target }}/optimized-release/iroh-relay" "dist/$bundle/"
          cp "target/${{ matrix.target }}/optimized-release/iroh-dns-server" "dist/$bundle/"
          tar -czf "dist/$bundle.tar.gz" -C "dist/$bundle" .
          rm -rf "dist/$bundle"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$bundle.tar.gz" > "$bundle.tar.gz.sha256")
          fi

      - name: Build archive and checksum
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION.TrimStart("v")
          $bundle = "iroh-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$bundle"
          Copy-Item "target/${{ matrix.target }}/optimized-release/iroh-relay.exe" "dist/$bundle/"
          Copy-Item "target/${{ matrix.target }}/optimized-release/iroh-dns-server.exe" "dist/$bundle/"
          Compress-Archive -Path "dist/$bundle/*" -DestinationPath "dist/$bundle.zip"
          Remove-Item -Recurse -Force "dist/$bundle"
          $hash = (Get-FileHash "dist/$bundle.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $bundle.zip" | Out-File "dist/$bundle.zip.sha256" -Encoding ascii

      - name: Retain release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: iroh-${{ matrix.target }}-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package_release:
    name: Verify publishable crate packages
    needs: [preflight, simulation_release_readiness]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.preflight.outputs.base_hash }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Package and build candidate-local crates
        run: scripts/verify-release-packages.sh

      - name: Retain crate archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: iroh-crate-packages
          path: target/release-packages/package/*.crate
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  supply_chain:
    name: Generate SBOM and provenance evidence
    needs: [preflight, build_release, package_release]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.preflight.outputs.base_hash }}

      - name: Download candidate artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          pattern: iroh-*
          path: subjects
          merge-multiple: true

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Generate aggregate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          file: Cargo.lock
          output-file: evidence/iroh-${{ inputs.release_version }}.spdx.json
          format: spdx-json
          syft-version: 1.44.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.packages | type == "array") and (.packages | length > 0) and
            (.relationships | type == "array")
          ' "evidence/iroh-$RELEASE_VERSION.spdx.json" >/dev/null

      - name: Attest candidate provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d  # v4
        with:
          subject-path: |
            subjects/**/*.tar.gz
            subjects/**/*.zip
            subjects/**/*.crate

      - name: Attest candidate SBOM
        id: sbom-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d  # v4
        with:
          subject-path: |
            subjects/**/*.tar.gz
            subjects/**/*.zip
            subjects/**/*.crate
          sbom-path: evidence/iroh-${{ inputs.release_version }}.spdx.json

      - name: Retain signed evidence bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "$PROVENANCE_BUNDLE" evidence/provenance.sigstore.json
          install -m 0644 "$SBOM_BUNDLE" evidence/sbom.sigstore.json
          (cd evidence && sha256sum -- *.json > SHA256SUMS)

      - name: Retain supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: iroh-v2-supply-chain-evidence
          path: evidence/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  containers:
    name: Build release containers
    needs: [preflight, build_release, package_release, supply_chain]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml
    with:
      release_version: ${{ inputs.release_version }}
      base_hash: ${{ needs.preflight.outputs.base_hash }}
      publish: ${{ inputs.publish_containers }}
      mark_latest: ${{ inputs.mark_latest }}

  create_release:
    name: Create draft GitHub release
    if: inputs.create_release
    needs: [preflight, build_release, package_release, supply_chain, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          pattern: iroh-*-bundle
          path: artifacts

      - name: Download supply-chain evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: iroh-v2-supply-chain-evidence
          path: artifacts/supply-chain

      - name: Verify retained checksums
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' checksum; do
            found=1
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done < <(find artifacts -type f -name '*.sha256' -print0)
          if [[ "$found" -ne 1 ]]; then
            echo "::error::no release checksums were downloaded"
            exit 2
          fi

      - name: Create draft release and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_HASH: ${{ needs.preflight.outputs.base_hash }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find artifacts -type f -print0 | sort -z)
          latest_args=()
          if [[ "$MARK_LATEST" == "true" ]]; then
            latest_args+=(--latest)
          fi
          gh release create "$RELEASE_VERSION" \
            "${assets[@]}" \
            --draft \
            --generate-notes \
            --target "$BASE_HASH" \
            --title "$RELEASE_VERSION" \
            "${latest_args[@]}"
