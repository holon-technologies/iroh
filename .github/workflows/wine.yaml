name: Wine Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wine-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings

jobs:
  wine_test:
    name: Wine Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Wine
        run: |
          # Use WineHQ for newer Wine with bcryptprimitives.dll support
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          ubuntu_codename=$(lsb_release --codename --short)
          wine_source="https://dl.winehq.org/wine-builds/ubuntu/dists/$ubuntu_codename/winehq-$ubuntu_codename.sources"
          sudo wget -O "/etc/apt/sources.list.d/winehq-$ubuntu_codename.sources" "$wine_source"
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable || sudo apt-get install -y wine64 wine32
          # Initialize Wine prefix
          WINEARCH=win64 wineboot --init

      - name: Install Rust + mingw target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get install -y mingw-w64

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6e08638ce5ee7b285b1e051c006e3be64fcff91  # nextest

      - name: Build tests
        # Release mode required - debug builds exceed mingw's export ordinal limit (~65k symbols)
        run: cargo build --target x86_64-pc-windows-gnu --tests -p iroh --release

      - name: Run tests under Wine
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
        run: >
          cargo nextest run
          --target x86_64-pc-windows-gnu
          --profile wine
          --release
          -p iroh
