name: Deterministic Simulation Weekly Service

on:
  schedule:
    - cron: "43 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iroh-deterministic-simulation-weekly
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings

jobs:
  service_contract:
    name: Operations, corpus, and parity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate checked service policy
        run: cargo test --manifest-path iroh-sim/Cargo.toml --test operations
      - name: Execute permanent corpus
        run: cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- corpus test iroh-sim/corpus
      - name: Exercise both replay lanes
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- run \
            iroh-sim/tests/fixtures/v2-ipv4-stream.json \
            --seed 8888888888888888888888888888888888888888888888888888888888888888 \
            --artifacts "$RUNNER_TEMP/raw-lane"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- replay "$RUNNER_TEMP/raw-lane/manifest.json"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- run \
            iroh-sim/tests/fixtures/v2-ipv4-stream.json \
            --seed 9999999999999999999999999999999999999999999999999999999999999999 \
            --crypto production-provider --artifacts "$RUNNER_TEMP/semantic-lane"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- replay "$RUNNER_TEMP/semantic-lane/manifest.json"
      - name: Export and compare canonical public parity evidence
        run: |
          mkdir -p "$RUNNER_TEMP/parity"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- parity export public \
            --seed 7777777777777777777777777777777777777777777777777777777777777777 \
            --source-revision "${{ github.sha }}" \
            --observed-at-unix-secs "$(date +%s)" \
            --output "$RUNNER_TEMP/parity/deterministic-public.json"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- parity compare \
            "$RUNNER_TEMP/parity/deterministic-public.json" \
            iroh-sim/tests/fixtures/patchbay-public.json \
            --output "$RUNNER_TEMP/parity/public-comparison.json"
      - name: Upload service evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iroh-sim-weekly-service-${{ github.run_id }}
          path: ${{ runner.temp }}/parity
          if-no-files-found: error
          retention-days: 30

  gate_runtime_slo:
    name: Audit PR and main simulation P95 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Audit latest compatible successful simulation gates
        id: runtime_slo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_root="$RUNNER_TEMP/gate-runtime-slo"
          report="$report_root/report.json"
          mkdir -p "$report_root"
          now_unix_secs=$(date +%s)
          set +e
          scripts/audit-simulation-gate-runtime-slo.sh \
            --repository "${{ github.repository }}" \
            --now-unix-secs "$now_unix_secs" \
            --policy iroh-sim/operations-policy.json \
            --output "$report"
          runtime_status=$?
          set -e
          if [[ ! -f "$report" ]]; then
            jq -n \
              --argjson observed_at_unix_secs "$now_unix_secs" \
              --argjson exit_code "$runtime_status" \
              '{
                schema_version: 1,
                status: "infrastructure_failure",
                reason: "runtime SLO auditor exited before publishing its typed report",
                observed_at_unix_secs: $observed_at_unix_secs,
                auditor_exit_code: $exit_code
              }' >"$report"
            runtime_status=2
          fi
          echo "status=$runtime_status" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Retain simulation gate runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iroh-sim-gate-runtime-slo-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-runtime-slo/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagate simulation gate runtime SLO
        if: always()
        shell: bash
        run: |
          runtime_status="${{ steps.runtime_slo.outputs.status }}"
          report="$RUNNER_TEMP/gate-runtime-slo/report.json"
          if [[ ! "$runtime_status" =~ ^[0-2]$ ]] \
            || ! jq -e '.schema_version == 1' "$report" >/dev/null; then
            echo "simulation gate runtime SLO did not publish valid evidence" >&2
            exit 2
          fi
          if [[ "$runtime_status" -eq 0 ]]; then
            jq -e '.status == "within_slo" or .status == "insufficient_history"' \
              "$report" >/dev/null
          elif [[ "$runtime_status" -eq 1 ]]; then
            jq -e '.status == "slo_breach"' "$report" >/dev/null
          else
            jq -e '.status == "infrastructure_failure"' "$report" >/dev/null
          fi
          exit "$runtime_status"

  performance_correlation:
    name: Simulator component performance correlation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Measure environment, relay, and scheduler components
        run: |
          cargo bench --manifest-path iroh-sim/Cargo.toml --bench stage4_environment
          cargo bench --manifest-path iroh-sim/Cargo.toml --bench stage5_relay
          cargo bench --manifest-path iroh-sim/Cargo.toml --bench stage6_scheduler
          cargo bench --manifest-path iroh-sim/Cargo.toml --bench deterministic_closure
      - name: Upload Criterion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iroh-sim-weekly-performance-${{ github.run_id }}
          path: iroh-sim/target/criterion
          if-no-files-found: error
          retention-days: 30
