# Weekly cleanup of the generated documentation branch.

name: Cleanup

on:
  schedule:
    # 06:50 UTC every Monday
    - cron: '50 6 * * 1'
  workflow_dispatch:

concurrency:
  group: cleanup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KRIKOS_FORCE_STAGING_RELAYS: "1"

jobs:
  clean_docs_branch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: generated-docs-preview
      - name: Clean docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd pr/
          # keep the last 25 prs
          mapfile -t doc_dirs < <(
            find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
              awk '/^[0-9]+$/' |
              sort -n
          )
          if ((${#doc_dirs[@]} > 25)); then
            remove_count=$((${#doc_dirs[@]} - 25))
            for ((index = 0; index < remove_count; index++)); do
              find "${doc_dirs[index]}" -depth -delete
            done
          fi
          git add .
          git diff --cached --quiet && echo "Nothing to clean up" && exit 0
          git commit -m "Cleanup old docs"
          git push


