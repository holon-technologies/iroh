name: Deterministic Simulation Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: krikos-deterministic-simulation-nightly
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings

jobs:
  gap_directed_campaign:
    name: Gap-directed deterministic campaign and replay audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Build source-bound simulator
        run: cargo build --release --manifest-path krikos-sim/Cargo.toml --bin cargo-sim
      - name: Collect latest compatible daily gap evidence
        id: gaps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          policy_blake3=$(jq -er '.coverage_policy_blake3' krikos-sim/soaks/daily.json)
          now_unix_secs=$(date -u '+%s')
          set +e
          scripts/collect-latest-simulation-gap-selection.sh \
            --repository "${{ github.repository }}" \
            --workflow simulation-daily-soak.yml \
            --policy-blake3 "$policy_blake3" \
            --now-unix-secs "$now_unix_secs" \
            --output "$RUNNER_TEMP/simulation-gap-source.json"
          collection_status=$?
          set -e
          if [[ "$collection_status" -eq 0 ]]; then
            degraded=false
          elif [[ "$collection_status" -eq 3 ]]; then
            degraded=true
            jq -n --arg policy_blake3 "$policy_blake3" '{
              schema_version: 1,
              source_workflow_run_id: null,
              source_revision: null,
              policy_blake3: $policy_blake3,
              lanes: [],
              gap_count: 0
            }' >"$RUNNER_TEMP/simulation-gap-source.json"
          else
            exit 2
          fi
          echo "degraded=$degraded" >> "$GITHUB_OUTPUT"
      - name: Materialize bounded gap-directed work
        shell: bash
        run: |
          printf '%s\n' '[]' >"$RUNNER_TEMP/no-changes.json"
          krikos-sim/target/release/cargo-sim gate-select \
            --impact-policy krikos-sim/change-impact-policy.json \
            --coverage-policy krikos-sim/coverage-policy.json \
            --base-revision 0000000000000000000000000000000000000000 \
            --candidate-revision "${{ github.sha }}" \
            --tier main \
            --changes "$RUNNER_TEMP/no-changes.json" \
            --diff-unavailable \
            --output "$RUNNER_TEMP/all-nightly-work.json"
          if [[ "${{ steps.gaps.outputs.degraded }}" == true ]]; then
            jq '.targeted = []' \
              "$RUNNER_TEMP/all-nightly-work.json" \
              >"$RUNNER_TEMP/nightly-selection.json"
          else
            jq --slurpfile gaps "$RUNNER_TEMP/simulation-gap-source.json" '
              .targeted = [
                .targeted[]
                | . as $work
                | select(any($gaps[0].lanes[]; . == $work.lane))
              ]
            ' "$RUNNER_TEMP/all-nightly-work.json" \
              >"$RUNNER_TEMP/nightly-selection.json"
          fi
      - name: Run bounded canary and gap-directed campaigns
        id: campaign
        shell: bash
        run: |
          set +e
          scripts/run-simulation-gate.sh \
            --selection "$RUNNER_TEMP/nightly-selection.json" \
            --sim-bin krikos-sim/target/release/cargo-sim \
            --artifacts "$RUNNER_TEMP/nightly-campaign" \
            --jobs 4
          campaign_status=$?
          set -e
          echo "status=$campaign_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Replay gap-directed manifests
        shell: bash
        run: |
          mapfile -d '' manifests < <(
            find "$RUNNER_TEMP/nightly-campaign" -type f -name manifest.json -print0 | sort -z
          )
          if ((${#manifests[@]} > 64)); then
            echo "nightly replay manifest bound exceeded" >&2
            exit 2
          fi
          for manifest in "${manifests[@]}"; do
            krikos-sim/target/release/cargo-sim replay "$manifest"
          done
      - name: Upload nightly gap and replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: krikos-sim-nightly-gaps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/simulation-gap-source.json
            ${{ runner.temp }}/nightly-selection.json
            ${{ runner.temp }}/nightly-campaign
          if-no-files-found: error
          retention-days: 14
      - name: Propagate gap-directed campaign result
        if: always()
        shell: bash
        run: |
          campaign_status="${{ steps.campaign.outputs.status }}"
          if [[ ! "$campaign_status" =~ ^[0-2]$ ]]; then
            echo "nightly gap campaign did not publish a typed status" >&2
            exit 2
          fi
          {
            echo "## Nightly deterministic gap audit"
            echo
            printf -- '- Degraded fallback: `%s`\n' "${{ steps.gaps.outputs.degraded }}"
            printf -- '- Status: `%s`\n' "$campaign_status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$campaign_status"

  stage2_replay_matrix:
    name: Stage 2 ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - scenario: ipv4-stream
            seed: "2222222222222222222222222222222222222222222222222222222222222222"
          - scenario: ipv4-stream-loss
            seed: "1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e"
          - scenario: ipv4-stream-corruption
            seed: "1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f"
          - scenario: ipv6-stream
            seed: "2424242424242424242424242424242424242424242424242424242424242424"
          - scenario: ipv6-datagram
            seed: "3333333333333333333333333333333333333333333333333333333333333333"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Prepare scenario diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/${{ matrix.scenario }}"
          {
            uname -a
            printf 'scenario=%s\n' "${{ matrix.scenario }}"
            printf 'seed=%s\n' "${{ matrix.seed }}"
          } >"$RUNNER_TEMP/${{ matrix.scenario }}/environment.txt"
      - name: Run named scenario
        run: |
          cargo run --manifest-path krikos-sim/Cargo.toml --bin cargo-sim -- run \
            "krikos-sim/tests/fixtures/${{ matrix.scenario }}.json" \
            --seed "${{ matrix.seed }}" \
            --artifacts "$RUNNER_TEMP/${{ matrix.scenario }}"
      - name: Replay byte-exact trace
        run: |
          cargo run --manifest-path krikos-sim/Cargo.toml --bin cargo-sim -- replay \
            "$RUNNER_TEMP/${{ matrix.scenario }}/manifest.json"
      - name: Upload simulation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: krikos-sim-${{ matrix.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ matrix.scenario }}
          if-no-files-found: error
          retention-days: 14

  resource_exhaustion:
    name: Resource exhaustion ${{ matrix.resource }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - resource: connection
          - resource: relay
          - resource: socket
          - resource: stream
          - resource: timer
          - resource: trace
    env:
      RESOURCE_SEED: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Run expected resource-exhaustion failure
        run: |
          cargo run --manifest-path krikos-sim/Cargo.toml --bin cargo-sim -- run \
            "krikos-sim/corpus/resource-${{ matrix.resource }}-limit/scenario.json" \
            --seed "$RESOURCE_SEED" \
            --artifacts "$RUNNER_TEMP/resource-${{ matrix.resource }}"
      - name: Replay exact resource-exhaustion failure
        run: |
          cargo run --manifest-path krikos-sim/Cargo.toml --bin cargo-sim -- replay \
            "$RUNNER_TEMP/resource-${{ matrix.resource }}/manifest.json"
      - name: Upload resource-exhaustion artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: krikos-sim-resource-${{ matrix.resource }}-${{ github.run_id }}
          path: ${{ runner.temp }}/resource-${{ matrix.resource }}
          if-no-files-found: error
          retention-days: 14
