name: CI

on:
  pull_request:
    types: ["labeled", "unlabeled", "opened", "synchronize", "reopened"]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  MSRV: "1.91"
  SCCACHE_CACHE_SIZE: "10G"
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  tests:
    name: CI Test Suite
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    uses: "./.github/workflows/tests.yaml"

  fuzz_smoke:
    name: Fuzz smoke (${{ matrix.target }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # Moving nightly toolchains can deprecate APIs that remain required by the stable MSRV.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        target:
          - doh_extract
          - pkarr_body
          - relay_segmentation
          - config_deserialize
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Check bounded fuzz tooling contract
        run: scripts/tests/check-fuzz-tooling.sh
      - name: Run bounded fuzz smoke
        run: |
          scripts/run-bounded-fuzz.sh \
            --seconds 1 \
            --target "${{ matrix.target }}" \
            --artifacts "$RUNNER_TEMP/fuzz-artifacts"
      - name: Retain fuzz diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 7

  simulation_contracts:
    name: Deterministic simulation contracts
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Check boundary checker contract
        run: scripts/tests/check-determinism-boundaries.sh
      - name: Check syntax-aware boundary checker contract
        run: scripts/tests/check-determinism-semantic.sh
      - name: Check reviewed boundary inventory
        run: scripts/check-determinism-boundaries.sh --check
      - name: Check stable syntax-aware boundary inventory
        run: scripts/check-determinism-semantic.sh --check
      - name: Check daily simulation soak runner
        run: scripts/tests/check-daily-simulation-soak.sh
      - name: Check daily simulation aggregate runner
        run: scripts/tests/check-daily-simulation-aggregate.sh
      - name: Check daily simulation soak workflow
        run: scripts/tests/check-daily-simulation-workflow.sh
      - name: Check deterministic simulation nightly workflow
        run: scripts/tests/check-simulation-nightly-workflow.sh
      - name: Check GitHub-hosted Patchbay smoke workflow
        run: scripts/tests/check-patchbay-hosted-smoke-workflow.sh
      - name: Check v2 release-readiness source contract
        run: scripts/tests/check-v2-release-readiness.sh
      - name: Check release dependency-fork boundary
        run: scripts/tests/check-release-fork-boundary.sh
      - name: Test runtime capability contracts
        run: cargo test -p iroh-runtime
      - name: Test manifest, trace, and replay contracts
        run: cargo test --manifest-path iroh-sim/Cargo.toml
      - name: Validate simulation operations and cross-backend parity policy
        run: cargo test --manifest-path iroh-sim/Cargo.toml --test operations --test parity
      - name: Run and replay Stage 2 production-IP smoke scenario
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- run \
            iroh-sim/tests/fixtures/ipv4-stream.json \
            --seed 1111111111111111111111111111111111111111111111111111111111111111 \
            --artifacts "$RUNNER_TEMP/iroh-sim-smoke"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- replay \
            "$RUNNER_TEMP/iroh-sim-smoke/manifest.json"
      - name: Run and replay Stage 3 declarative production-IP smoke scenario
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- run \
            iroh-sim/tests/fixtures/v2-ipv4-stream.json \
            --seed 1212121212121212121212121212121212121212121212121212121212121212 \
            --artifacts "$RUNNER_TEMP/iroh-sim-declarative"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- replay \
            "$RUNNER_TEMP/iroh-sim-declarative/manifest.json"
      - name: Run and replay production-crypto semantic smoke scenario
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- run \
            iroh-sim/tests/fixtures/v2-ipv4-stream.json \
            --seed 1313131313131313131313131313131313131313131313131313131313131313 \
            --crypto production-provider \
            --artifacts "$RUNNER_TEMP/iroh-sim-production-crypto"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- replay \
            "$RUNNER_TEMP/iroh-sim-production-crypto/manifest.json"
      - name: Test reviewed corpus and bounded generated campaign
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- corpus test iroh-sim/corpus
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            iroh-sim/tests/fixtures/v2-ipv4-stream.json \
            --seeds 0..4 --jobs 2 --generated --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-campaign"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            --swarm iroh-sim/swarms/direct-smoke.json \
            --seeds 0..4 --jobs 2 --continue-on-failure --max-runs 4 \
            --artifacts "$RUNNER_TEMP/iroh-sim-swarm"
      - name: Run Stage 4 NAT, discovery, and mobility smoke campaigns
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            --swarm iroh-sim/swarms/nat-behavior.json \
            --seeds 0..2 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage4-nat"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            --swarm iroh-sim/swarms/discovery-timing.json \
            --seeds 0..2 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage4-discovery"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            --swarm iroh-sim/swarms/mobility-timing.json \
            --seeds 0..2 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage4-mobility"
      - name: Run Stage 5 relay restart and fallback smoke campaigns
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            --swarm iroh-sim/swarms/relay-lifecycle.json \
            --seeds 0..3 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage5-relay-restart"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            iroh-sim/corpus/stage5-direct-relay-fallback/scenario.json \
            --seeds 0..3 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage5-relay-fallback"
      - name: Run Stage 6 rare ready-order replay smoke campaigns
        run: |
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            --swarm iroh-sim/swarms/ready-order-pressure.json \
            --seeds 0..8 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage6-direct-schedules"
          cargo run --manifest-path iroh-sim/Cargo.toml --bin cargo-sim -- campaign \
            iroh-sim/corpus/stage5-relay-restart/scenario.json \
            --seeds 0..8 --jobs 2 --continue-on-failure \
            --artifacts "$RUNNER_TEMP/iroh-sim-stage6-relay-schedules"
      - name: Test Iroh runtime adapter
        run: cargo test -p iroh --lib runtime --all-features
      - name: Check native minimal feature graph
        run: cargo check -p iroh --no-default-features
      - name: Check simulation code quality
        run: |
          cargo clippy -p iroh-runtime -p iroh --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path iroh-sim/Cargo.toml --all-targets --all-features -- -D warnings

  cross_build:
    name: Cross Build Only
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings --cfg skip_patchbay"
    strategy:
      fail-fast: false
      matrix:
        target:
          # cross tests are currently broken vor armv7 and aarch64
          # see https://github.com/cross-rs/cross/issues/1311
          # - armv7-linux-androideabi
          # - aarch64-linux-android
          # Freebsd execution fails in cross
          # - i686-unknown-freebsd # Linking fails :/
          - x86_64-unknown-freebsd
          # Netbsd execution fails to link in cross
          # - x86_64-unknown-netbsd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cleanup Docker
        continue-on-error: true
        run: |
          mapfile -t running_containers < <(docker ps --quiet)
          if ((${#running_containers[@]} != 0)); then
            docker kill "${running_containers[@]}"
          fi

        # See https://github.com/cross-rs/cross/issues/1222
      - name: Cache cross
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ runner.arch }}

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cross

      - name: build
        # cross tests are currently broken vor armv7 and aarch64
        # see https://github.com/cross-rs/cross/issues/1311.  So on
        # those platforms we only build but do not run tests.
        run: cross build --all --target ${{ matrix.target }}
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

  android:
    name: Android Build & Test
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
          - target: armv7-linux-androideabi
          - target: x86_64-linux-android
            api-level: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM for nested virtualization
        if: matrix.target == 'x86_64-linux-android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Pinned to a release tag (rather than @main) for supply-chain hygiene.
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install --version 4.1.2 cargo-ndk

      # Replace cargo-ndk-runner with a wrapper that forwards RUST_LOG
      # and RUST_BACKTRACE into the emulator shell. The upstream binary
      # does `adb shell <bin>` without inheriting any host env.
      #
      # The wrapper also removes each binary from the guest once it has run.
      # A full run pushes ~1.25GB of debug test binaries into /data/local/tmp
      # and the guest data partition is only ~5.8GB, so leaving them behind
      # accumulates across jobs (see the sweep in the emulator script below).
      - name: Wrap cargo-ndk-runner to forward logging env
        if: matrix.target == 'x86_64-linux-android'
        run: |
          cat > "$(which cargo-ndk-runner)" <<'WRAPPER'
          #!/bin/sh
          set -e
          dev=/data/local/tmp/$(basename "$1")
          adb push "$1" "$dev" >/dev/null
          adb shell chmod 755 "$dev"
          shift
          set +e
          adb shell "RUST_LOG=$RUST_LOG RUST_BACKTRACE=$RUST_BACKTRACE $dev $*"
          rc=$?
          adb shell rm -f "$dev" >/dev/null 2>&1
          exit $rc
          WRAPPER
          chmod +x "$(which cargo-ndk-runner)"

      - name: Build
        if: matrix.target != 'x86_64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk --target ${{ matrix.target }} build

      # Build all the test binaries up front so the emulator boot can
      # overlap with compilation. cargo-ndk runs `cargo test --no-run`
      # against each crate; the binaries land in
      # target/$CARGO_NDK_TARGET/debug/deps/.
      - name: Build workspace test binaries
        if: matrix.target == 'x86_64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_NDK_TARGET: ${{ matrix.target }}
        run: |
          cargo ndk test --no-run -p iroh-base --all-features
          cargo ndk test --no-run -p iroh-dns --features tls-ring
          cargo ndk test --no-run -p iroh-relay --features tls-ring,metrics
          cargo ndk test --no-run -p iroh --features tls-ring,metrics,portmapper,test-utils

      - name: Run workspace tests on Android emulator
        if: matrix.target == 'x86_64-linux-android'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Forwarded into the emulator by the cargo-ndk-runner wrapper.
          RUST_LOG: trace
          RUST_BACKTRACE: "1"
          CARGO_NDK_TARGET: ${{ matrix.target }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # `-dns-server` + `-netfast` + `-no-metrics` is the combination reported to give
          # working public-internet connectivity on the GH-hosted runner; without them wlan0
          # stays NO-CARRIER and every connect() to a public IP fails with ENETUNREACH.
          # See https://github.com/ReactiveCircus/android-emulator-runner/issues/348#issuecomment-2578082030
          #
          # Always cold boot and never save emulator state so DNS and routing
          # behavior starts from the same baseline on every hosted runner.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -dns-server 8.8.8.8 -netfast -no-metrics -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            # Wait for full boot and a working outbound TCP. `sys.boot_completed=1` fires
            # before the radio/Wi-Fi stack comes up, and `ip route get 8.8.8.8` reports
            # success while the kernel's per-network fwmark route is still missing. Probe
            # an actual TCP connect to 8.8.8.8:53 instead - it exercises the same path
            # the test sockets will use.
            adb shell 'i=0; while [ -z "$(getprop sys.boot_completed | tr -d "\r")" ]; do i=$((i+1)); if [ $i -gt 300 ]; then exit 1; fi; sleep 2; done'
            adb shell 'i=0; while ! nc -w 2 8.8.8.8 53 </dev/null >/dev/null 2>&1; do i=$((i+1)); if [ $i -gt 30 ]; then exit 1; fi; sleep 2; done'
            # Disable IPv6: the emulator has site-local + link-local v6 but no global v6
            # route, so connect() to a global v6 address hangs instead of returning ENETUNREACH.
            adb root && adb wait-for-device
            adb shell sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
            adb shell sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true
            adb shell sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true
            adb shell ip addr
            # Sweep test binaries before execution so the emulator has a
            # deterministic amount of free space. The runner wrapper also
            # removes each binary after it runs.
            adb shell 'rm -rf /data/local/tmp/*' || true
            adb shell df -h /data
            cargo ndk test -p iroh-base --all-features
            cargo ndk test -p iroh-dns --features tls-ring
            cargo ndk test -p iroh-relay --features tls-ring,metrics
            cargo ndk test -p iroh --features tls-ring,metrics,portmapper,test-utils

  cross_test:
    name: Cross Test
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
    env:
      RUSTFLAGS: "-Dwarnings --cfg skip_patchbay"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cleanup Docker
        continue-on-error: true
        run: |
          mapfile -t running_containers < <(docker ps --quiet)
          if ((${#running_containers[@]} != 0)); then
            docker kill "${running_containers[@]}"
          fi

        # See https://github.com/cross-rs/cross/issues/1222
      - name: Cache cross
        id: cache-cross
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-${{ runner.arch }}

      - name: Install cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cross

      - name: test
        run: cross test --all --target ${{ matrix.target }} -- --test-threads=12
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc

  wasm_test:
    name: Build & test wasm32 for browsers
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup node.js version 22.5 # needed for browser-like websocket API support in node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-test-runner
        uses: taiki-e/install-action@v2
        with:
          # Match the version of wasm-bindgen used in Cargo.lock
          tool: wasm-bindgen-cli@0.2.122

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1

      - name: wasm32 build (iroh-base)
        run: cargo build --target wasm32-unknown-unknown -p iroh-base --all-features

      - name: wasm32 build (iroh-relay)
        run: cargo build --target wasm32-unknown-unknown -p iroh-relay

      - name: wasm32 build (iroh)
        run: cargo build --target wasm32-unknown-unknown -p iroh

      - name: wasm32 build (iroh-runtime portable contracts)
        run: cargo build --target wasm32-unknown-unknown -p iroh-runtime

      # If the Wasm file contains any 'import "env"' declarations, then
      # some non-Wasm-compatible code made it into the final code.
      - name: Ensure no 'import "env"' in iroh-relay Wasm
        run: |
          ! wasm-tools print --skeleton target/wasm32-unknown-unknown/debug/iroh_relay.wasm | grep 'import "env"'

      - name: Ensure no 'import "env"' in iroh Wasm
        run: |
          ! wasm-tools print --skeleton target/wasm32-unknown-unknown/debug/iroh.wasm | grep 'import "env"'

      - name: Run integration test in wasm
        run: cargo test -p iroh --test integration --target=wasm32-unknown-unknown

  check_semver:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - uses: ./.github/actions/sccache-probe
      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-19
      - name: Install pinned semver verifier
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.49.0
      - name: Check v2 public API against v1.0.3
        run: scripts/run-v2-semver-checks.sh

  check_external_types:
    timeout-minutes: 30
    name: Check external types in public API
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
      # The tool drives an internal rustdoc invocation that only emits JSON
      # for the analyzer, so the workflow-wide `-Dwarnings` would just turn
      # unrelated rustdoc lints (e.g. `private-intra-doc-links`) into hard
      # failures here. Clear it for this job.
      RUSTDOCFLAGS: ""
      # Pin to the nightly that the pinned `cargo-check-external-types`
      # release was last tested against. Update both together.
      CARGO_CHECK_EXTERNAL_TYPES_VERSION: "0.5.0"
      TOOLCHAIN: "nightly-2026-03-20"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install cargo-check-external-types
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-make
            cargo-check-external-types@${{ env.CARGO_CHECK_EXTERNAL_TYPES_VERSION }}

      - name: Check external types
        run: cargo make check-external-types

  check_fmt:
    timeout-minutes: 30
    name: Checking fmt
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - uses: ./.github/actions/sccache-probe
      - uses: taiki-e/install-action@cargo-make
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: cargo make format-check
      - name: Check determinism boundary inventory
        run: scripts/check-determinism-boundaries.sh --check
      - name: Check production resource canary workflow
        run: scripts/tests/check-resource-canary-workflow.sh
      - name: Check bounded fuzz tooling
        run: scripts/tests/check-fuzz-tooling.sh
      - name: Check determinism documentation consistency
        run: scripts/tests/check-determinism-docs.sh

  check_docs:
    timeout-minutes: 30
    name: Checking docs
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
      RUSTDOCFLAGS: --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-10-09
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - uses: ./.github/actions/sccache-probe

      - name: Docs
        run: |
          cargo doc --workspace --all-features --no-deps --document-private-items
          cargo doc --manifest-path iroh-sim/Cargo.toml --all-features --no-deps --document-private-items

  clippy_check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - uses: ./.github/actions/sccache-probe

      # TODO: We have a bunch of platform-dependent code so should
      #    probably run this job on the full platform matrix
      - name: clippy check (all features)
        run: cargo clippy --workspace --all-features --all-targets --lib --bins --tests --benches --examples

      - name: clippy check (no features)
        run: cargo clippy --workspace --no-default-features --all-targets --lib --bins --tests --benches --examples

      - name: clippy check (default features)
        run: cargo clippy --workspace --all-targets --lib --bins --tests --benches --examples

  check_optional_deps:
    timeout-minutes: 10
    name: Check optional deps are absent without features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify optional deps are absent without features
        run: |
          fail=0
          for dep in portmapper igd-next swarm-discovery ring aws-lc-rs; do
            echo    "cargo tree -p iroh --no-default-features --edges normal --target all -i $dep";
            output=$(cargo tree -p iroh --no-default-features --edges normal --target all -i "$dep" 2>&1) || true
            if ! echo "$output" | grep -qE "(nothing to print|did not match any packages)"; then
              echo "ERROR: $dep should not be in the dependency tree without its feature"
              echo "$output"
              fail=1
            fi
          done
          exit $fail

  msrv:
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    timeout-minutes: 30
    name: Minimal Supported Rust Version
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - uses: ./.github/actions/sccache-probe

      - name: Check MSRV all features
        run: |
          cargo "+$MSRV" check --workspace --all-targets

  cargo_deny:
    timeout-minutes: 30
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features
          command: check
          command-arguments: "-Dwarnings"

  netsim-integration-tests:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: "github.event_name != 'pull_request' || ! contains(github.event.pull_request.labels.*.name, 'flaky-test')"
    uses: "./.github/workflows/netsim_runner.yaml"
    with:
      iroh_ref: ${{ github.sha }}
      max_workers: 6
      netsim_ref: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      sim_paths: ${{ github.event_name == 'pull_request' && 'sims/integration' || 'sims/iroh/iroh.json,sims/integration' }}
      pr_number: ${{ github.event.pull_request.number || '' }}
      filter: ${{ github.event_name == 'pull_request' && 'skip:intg_iroh_full__1_to_3,intg_iroh_full__1_to_1x3,intg_iroh_relay_only__1_to_3' || '' }}

  codespell:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-codespell-2.4.1
      - run: pip install --user codespell[toml]==2.4.1
      - run: codespell --ignore-words-list=ans,atmost,crate,inout,ratatui,ser,stayin,swarmin,worl,keep-alives --skip=CHANGELOG.md,vendor
