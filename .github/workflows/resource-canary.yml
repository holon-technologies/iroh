name: Production Resource Canary

on:
  schedule:
    - cron: "11 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-resource-canary
  cancel-in-progress: false

jobs:
  production_resource_canary:
    name: Dedicated-host 2x production resource evidence
    runs-on: [self-hosted, linux, X64, iroh-resource-canary]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build optimized resource canary
        run: >-
          cargo build --profile optimized-release -p iroh-bench
          --features resource-canary --bin resource-canary
      - name: Validate dedicated host without load
        run: >-
          target/optimized-release/resource-canary preflight
          --baseline-seconds 5 --output target/resource-canary-scheduled
      - name: Run exact production evidence profile
        run: >-
          target/optimized-release/resource-canary run --lane all --scale-percent 100
          --warmup-seconds 30 --measurement-seconds 300 --cooldown-seconds 30
          --sample-interval-seconds 1 --baseline-seconds 5
          --output target/resource-canary-scheduled
      - name: Verify retained artifact manifests
        run: |
          mapfile -t digests < <(find target/resource-canary-scheduled -name manifest.sha256 -type f -print)
          test "${#digests[@]}" -ge 2
          for digest in "${digests[@]}"; do
            artifact_dir=$(dirname "$digest")
            (cd "$artifact_dir" && sha256sum --check manifest.sha256)
          done
      - name: Upload bounded canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-resource-canary-${{ github.run_id }}
          path: target/resource-canary-scheduled
          if-no-files-found: error
          retention-days: 30
