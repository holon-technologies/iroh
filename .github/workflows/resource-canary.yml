name: GitHub-hosted Resource Observation

on:
  schedule:
    - cron: "11 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-resource-canary
  cancel-in-progress: false

jobs:
  hosted_resource_observation:
    name: GitHub-hosted 50%-scale resource observation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Build optimized resource canary
        run: >-
          cargo build --profile optimized-release -p iroh-bench
          --features resource-canary --bin resource-canary
      - name: Validate hosted runner without load
        run: >-
          target/optimized-release/resource-canary preflight
          --host-profile github-hosted-standard
          --baseline-seconds 5 --output target/resource-canary-scheduled
      - name: Run hosted resource observation
        run: >-
          target/optimized-release/resource-canary run --host-profile github-hosted-standard
          --lane all --scale-percent 50
          --warmup-seconds 30 --measurement-seconds 300 --cooldown-seconds 30
          --sample-interval-seconds 1 --baseline-seconds 5
          --output target/resource-canary-scheduled
      - name: Verify retained artifact manifests
        run: |
          mapfile -t digests < <(find target/resource-canary-scheduled -name manifest.sha256 -type f -print)
          test "${#digests[@]}" -ge 2
          for digest in "${digests[@]}"; do
            artifact_dir=$(dirname "$digest")
            (cd "$artifact_dir" && sha256sum --check manifest.sha256)
          done
      - name: Upload bounded canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: github-hosted-resource-observation-${{ github.run_id }}
          path: target/resource-canary-scheduled
          if-no-files-found: error
          retention-days: 30
