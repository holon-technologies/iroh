name: netsim-CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      iroh_ref:
        description: "Pinned 40-character Iroh commit SHA"
        required: true
        type: string
      netsim_ref:
        description: "Pinned 40-character commit SHA from n0-computer/chuck"
        required: false
        type: string
        default: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      report_table:
        required: false
        type: boolean
        default: false
      rust_log:
        description: "Custom RUST_LOG value (e.g. 'iroh=debug,noq=trace'). If empty, defaults to warn."
        required: false
        type: string
        default: ""

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  MSRV: "1.66"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  netsim-release:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: ${{github.ref_name=='main' && github.event_name == 'push'}}
    uses: './.github/workflows/netsim_runner.yaml'
    with:
      iroh_ref: ${{ github.sha }}
      # Match the concurrency proven by the main CI netsim job on the same runner class.
      max_workers: 6
      netsim_ref: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      sim_paths: "sims/iroh,sims/integration"
      pr_number: ""
      build_profile: "optimized-release"
      # Ten simultaneous 10 GiB transfers exceed Chuck's fixed 300-second
      # per-case deadline on GitHub-hosted runners; the smaller 10 GiB fan-outs remain covered.
      filter: "skip:iroh_cust_10gb__1_to_10"

  netsim-perf:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: ${{github.event_name != 'push'}}
    uses: './.github/workflows/netsim_runner.yaml'
    with:
      iroh_ref: ${{inputs.iroh_ref}}
      max_workers: 1
      netsim_ref: ${{inputs.netsim_ref}}
      sim_paths: "sims/iroh"
      pr_number: ${{inputs.pr_number}}
      build_profile: "optimized-release"
      report_table: ${{inputs.report_table}}
      rust_log: ${{inputs.rust_log}}
