name: netsim-CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      krikos_ref:
        description: "Pinned 40-character Krikos commit SHA"
        required: true
        type: string
      netsim_ref:
        description: "Pinned 40-character commit SHA from n0-computer/chuck"
        required: false
        type: string
        default: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      report_table:
        required: false
        type: boolean
        default: false
      rust_log:
        description: "Custom RUST_LOG value (e.g. 'krikos=debug,noq=trace'). If empty, defaults to warn."
        required: false
        type: string
        default: ""

concurrency:
  group: krikos-netsim-${{ github.ref || inputs.krikos_ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  KRIKOS_FORCE_STAGING_RELAYS: "1"

jobs:
  netsim-release:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: ${{github.ref_name=='main' && github.event_name == 'push'}}
    uses: './.github/workflows/netsim_runner.yaml'
    with:
      krikos_ref: ${{ github.sha }}
      # Match the concurrency proven by the main CI netsim job on the same runner class.
      max_workers: 6
      netsim_ref: "7321e503c462822ecd6e2e49bbcc8ec77ad695ce"
      sim_paths: "sims/iroh,sims/integration"
      pr_number: ""
      build_profile: "optimized-release"
      # Keep aggregate 10 GiB workloads in the manually dispatched performance lane:
      # they cannot complete within Chuck's 300-second per-case deadline on hosted CI.
      filter: "skip:krikos_cust_10gb,krikos_relay_only__1_to_10"

  netsim-perf:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: ${{github.event_name != 'push'}}
    uses: './.github/workflows/netsim_runner.yaml'
    with:
      krikos_ref: ${{inputs.krikos_ref}}
      max_workers: 1
      netsim_ref: ${{inputs.netsim_ref}}
      sim_paths: "sims/iroh"
      pr_number: ${{inputs.pr_number}}
      build_profile: "optimized-release"
      report_table: ${{inputs.report_table}}
      rust_log: ${{inputs.rust_log}}
