[package]
name = "iroh-docs"
version.workspace = true
edition.workspace = true
readme = "README.md"
description = "Iroh sync"
license.workspace = true
authors = ["n0 team"]
repository.workspace = true
publish = false

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2.4.0"
blake3 = "1.8"
bytes = { version = "1.7", features = ["serde"] }
data-encoding = "2.6.0"
derive_more = { version = "2.0.1", features = [
    "debug",
    "deref",
    "display",
    "from",
    "from_str",
    "try_into",
    "into",
    "as_ref",
] }
futures-buffered = "0.2.4"
hex = "0.4"
iroh = { workspace = true, default-features = false }
iroh-base = { workspace = true, features = ["key"] }
iroh-blobs = { workspace = true, default-features = false }
iroh-gossip = { workspace = true, features = ["net"], default-features = false }
iroh-metrics = { version = "1", default-features = false }
irpc = { version = "0.17", default-features = false }
n0-error = "1"
n0-future = { version = "0.3.1", features = ["serde"] }
num_enum = "0.7"
postcard = { version = "1", default-features = false, features = [
    "alloc",
    "use-std",
    "experimental-derive",
] }
noq = { version = "1", optional = true }
rand = "0.10"
redb = { version = "4.1" }
redb_v3 = { package = "redb", version = "3.1", optional = true }
self_cell = "1.0.3"
serde = { version = "1.0.164", features = ["derive"] }
serde-error = "0.1.3"
strum = { version = "0.28", features = ["derive"] }
tempfile = { version = "3.4" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7.12", features = ["codec", "io-util", "io", "rt"] }
tracing = "0.1"

[dev-dependencies]
data-encoding = "2.6.0"
iroh = { workspace = true, features = ["test-utils", "tls-ring"] }
nested_enum_utils = "0.2"
parking_lot = "0.12.3"
proptest = "1.2.0"
rand = { version = "0.10", features = ["chacha"] }
tempfile = "3.4"
test-strategy = "0.4"
testdir = "0.10"
testresult = "0.4.1"
tokio = { version = "1", features = ["sync", "macros"] }
tracing-test = "0.2.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[features]
default = ["metrics", "rpc", "fs-store", "redb-v2-migration"]
metrics = ["iroh-metrics/metrics", "iroh/metrics"]
rpc = ["dep:noq", "irpc/rpc", "iroh-blobs/rpc"]
fs-store = ["iroh-blobs/fs-store"]
redb-v2-migration = ["dep:redb_v3"]

[[example]]
name = "docs-setup"
path = "examples/setup.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "iroh_docsrs"]

[lints]
workspace = true

[build-dependencies]
cfg_aliases = "0.2.1"
