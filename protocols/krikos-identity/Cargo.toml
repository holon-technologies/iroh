[package]
name = "krikos-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Distributed multi-device identity and authorization for Krikos"
keywords = ["identity", "authorization", "cryptography", "peer-to-peer"]
categories = ["authentication", "cryptography", "network-programming"]
publish = false

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
curve25519-dalek = { version = "5", default-features = false }
data-encoding = "2.6"
getrandom = { version = "0.4", default-features = false, optional = true }
krikos-base = { workspace = true, default-features = false, features = ["key-types"] }
krikos = { workspace = true, default-features = false, optional = true }
postcard = { version = "=1.1.3", features = ["use-std"] }
rand_core = { version = "0.10", default-features = false }
redb = { version = "4.1", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "sync", "time"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["rt"], optional = true }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
futures-lite = "2"
hex = "0.4"
krikos = { workspace = true, default-features = false, features = ["test-utils", "tls-ring"] }
proptest = "1.11"
serde_json = "1"
tempfile = "3.20"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[features]
default = []
fs-store = ["dep:redb"]
net = ["dep:krikos", "dep:tokio", "dep:tokio-util"]
os-rng = ["dep:getrandom"]
provider-store = ["dep:redb"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "krikos_docsrs"]

[[example]]
name = "generate_interop_vectors"
required-features = ["net"]
